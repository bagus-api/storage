  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #1e0a1a 0%, #2c0f1f 100%);
      font-family: 'Inter', sans-serif;
      color: #f9eef3;
      padding: 1.5rem 1rem 3rem;
      min-height: 100vh;
    }

    /* efek bunga latar halus */
    body::before {
      content: "<9";
      font-size: 280px;
      position: fixed;
      bottom: -60px;
      right: -80px;
      opacity: 0.08;
      pointer-events: none;
      transform: rotate(-15deg);
      z-index: 0;
    }

    body::after {
      content: "<9";
      font-size: 200px;
      position: fixed;
      top: 10%;
      left: -70px;
      opacity: 0.06;
      pointer-events: none;
      transform: rotate(25deg);
      z-index: 0;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* profile card */
    .profile {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeUp 0.6s ease-out;
    }

    .avatar {
      width: 110px;
      height: 110px;
      background: linear-gradient(135deg, #c44569, #9b2f4c);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 15px 30px -12px rgba(155, 47, 76, 0.5), 0 0 0 4px #ffd9e6, 0 0 0 8px rgba(196, 69, 105, 0.3);
      transition: transform 0.2s;
    }

    .avatar i {
      font-size: 3.8rem;
      color: #fff3e8;
      text-shadow: 2px 2px 8px #510e2a;
    }

    .avatar:hover {
      transform: scale(1.02);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(120deg, #FFB7C5, #E86F9C, #B3416E);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
      margin-bottom: 0.25rem;
    }

    .sub {
      font-size: 0.9rem;
      background: rgba(255, 210, 225, 0.15);
      backdrop-filter: blur(4px);
      display: inline-block;
      padding: 0.25rem 1rem;
      border-radius: 40px;
      font-weight: 500;
      color: #ffdbeb;
      margin-top: 6px;
    }

    /* 3 menu utama */
    .links-section {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      margin: 2rem 0 2rem;
    }

    .link-card {
      background: rgba(30, 12, 24, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(235, 110, 146, 0.5);
      border-radius: 60px;
      padding: 1rem 1.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.25s ease;
      text-decoration: none;
      color: #ffeef4;
      font-weight: 600;
      font-size: 1.1rem;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
    }

    .link-card:hover {
      background: rgba(156, 47, 87, 0.55);
      border-color: #ff91b0;
      transform: translateY(-3px);
      box-shadow: 0 16px 28px -10px #9b2f4c80;
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .link-left i {
      font-size: 1.7rem;
      width: 36px;
      text-align: center;
      color: #ffb7ca;
    }

    .arrow-icon {
      opacity: 0.7;
      transition: transform 0.2s;
    }

    .link-card:hover .arrow-icon {
      transform: translateX(5px);
      opacity: 1;
    }

    .footer-note {
      text-align: center;
      margin-top: 2.5rem;
      font-size: 0.75rem;
      color: #d99eb4;
      border-top: 1px dashed rgba(232, 67, 110, 0.4);
      padding-top: 1.5rem;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .footer-note span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* responsif */
    @media (max-width: 480px) {
      .link-card {
        padding: 0.8rem 1.3rem;
        font-size: 1rem;
      }
      .avatar {
        width: 90px;
        height: 90px;
      }
      .avatar i {
        font-size: 3rem;
      }
      h1 {
        font-size: 1.8rem;
      }
      .link-left i {
        font-size: 1.5rem;
        width: 30px;
      }
    }
  </style>
</head>

<script>
  // ============================================================
  // 3 MENU: WhatsApp Channel, TikTok, WhatsApp Grup
  // Ganti URL di bawah dengan tautan asli Anda

  const LINKS = {
    whatsappChannel: "https://whatsapp.com/channel/0029VbCd7Uk8F2pAVkg57R1q",   // Ganti dengan link channel WA asli
    tiktok: "https://tiktok.com/@bobbysukasotot",                     // Ganti dengan username TikTok asli
    whatsappGroup: "https://chat.whatsapp.com/GwHqS6bVEPPEaoWmcHUaCf?mode=gi_t"     // Ganti dengan link grup WA asli
  };
  
  // Fungsi toast notifikasi modern
  function showToast(message, icon = "<9") {
    const toast = document.createElement("div");
    toast.innerText = `${icon}  ${message}`;
    toast.style.position = "fixed";
    toast.style.bottom = "25px";
    toast.style.left = "50%";
    toast.style.transform = "translateX(-50%)";
    toast.style.backgroundColor = "#2a0f1f";
    toast.style.backdropFilter = "blur(16px)";
    toast.style.color = "#ffeef4";
    toast.style.padding = "12px 22px";
    toast.style.borderRadius = "50px";
    toast.style.fontWeight = "500";
    toast.style.fontSize = "0.85rem";
    toast.style.border = "1px solid #e8436e";
    toast.style.boxShadow = "0 8px 20px rgba(0,0,0,0.4)";
    toast.style.zIndex = "9999";
    toast.style.fontFamily = "Inter, sans-serif";
    toast.style.letterSpacing = "0.3px";
    document.body.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = "0";
      setTimeout(() => toast.remove(), 400);
    }, 2000);
  }
  
  function redirectTo(url, menuName) {
    if (!url || url === "#") {
      showToast(`= ${menuName}  tautan belum diatur`, "<:");
      return;
    }
    showToast(`( Membuka ${menuName}...`, "<9");
    setTimeout(() => {
      window.open(url, '_blank', 'noopener,noreferrer');
    }, 150);
  }
  
  // Event listener untuk 3 menu
  const waChannelBtn = document.getElementById('https://whatsapp.com/channel/0029VbCd7Uk8F2pAVkg57R1q');
  const tiktokBtn = document.getElementById('tiktokLink');
  const waGrupBtn = document.getElementById('https://chat.whatsapp.com/GwHqS6bVEPPEaoWmcHUaCf?mode=gi_t');
  
  waChannelBtn.addEventListener('click', (e) => {
    e.preventDefault();
    redirectTo(LINKS.whatsappChannel, "Saluran WhatsApp");
  });
  
  tiktokBtn.addEventListener('click', (e) => {
    e.preventDefault();
    redirectTo(LINKS.tiktok, "TikTok");
  });
  
  waGrupBtn.addEventListener('click', (e) => {
    e.preventDefault();
    redirectTo(LINKS.whatsappGroup, "Grup WhatsApp");
  });
  
  // Efek tambahan pada footer agar lebih hidup
  console.log("Website 3 menu: WhatsApp Channel, TikTok, Grup WhatsApp  warna ungu merah mawar");
</script>
