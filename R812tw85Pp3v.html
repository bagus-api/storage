<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR07 | KRPDXPLOIT x REBETEAM</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020204;
            font-family: "Courier New", monospace;
            color: #00ff88;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Background */
        .background {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at center, rgba(0,255,120,.08), transparent 40%),
                linear-gradient(135deg, #020204, #050b08, #000);
            z-index: -5;
        }

        /* Matrix */
        canvas {
            position: fixed;
            inset: 0;
            z-index: -4;
            opacity: .18;
        }

        /* Scanlines */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,.025) 0px,
                rgba(255,255,255,.025) 1px,
                transparent 2px,
                transparent 4px
            );
        }

        /* Vignette */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 19;
            background: radial-gradient(
                ellipse at center,
                transparent 40%,
                rgba(0,0,0,.75) 100%
            );
        }

        .container {
            width: min(900px, 92%);
            min-height: 580px;
            padding: 35px;
            position: relative;
            border: 1px solid rgba(0,255,136,.35);
            background: rgba(0,0,0,.68);
            box-shadow:
                0 0 30px rgba(0,255,136,.12),
                inset 0 0 50px rgba(0,255,136,.03);
            backdrop-filter: blur(5px);
            text-align: center;
            animation: appear 1.2s ease;
        }

        .container::before,
        .container::after {
            content: "";
            position: absolute;
            width: 45px;
            height: 45px;
            border-color: #00ff88;
        }

        .container::before {
            top: -1px;
            left: -1px;
            border-top: 2px solid;
            border-left: 2px solid;
        }

        .container::after {
            bottom: -1px;
            right: -1px;
            border-bottom: 2px solid;
            border-right: 2px solid;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(.92);
                filter: blur(8px);
            }
            to {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        /* Top */
        .warning {
            color: #ff1744;
            font-size: 13px;
            letter-spacing: 4px;
            margin-bottom: 20px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: .35;
            }
        }

        /* Hacker */
        .hacker {
            width: 180px;
            height: 180px;
            margin: auto;
            position: relative;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle,
                rgba(0,255,136,.15),
                rgba(0,0,0,.5) 65%);
            border: 1px solid rgba(0,255,136,.35);
            box-shadow:
                0 0 20px rgba(0,255,136,.2),
                inset 0 0 30px rgba(0,255,136,.08);
        }

        /* Hat */
        .hat {
            position: absolute;
            top: 35px;
            width: 105px;
            height: 40px;
            background: #050505;
            border-radius: 60% 60% 15% 15%;
            transform: rotate(-5deg);
            box-shadow: 0 0 12px #000;
        }

        .hat::before {
            content: "";
            position: absolute;
            width: 145px;
            height: 12px;
            left: -20px;
            bottom: -5px;
            background: #050505;
            border-radius: 50%;
        }

        /* Face */
        .face {
            position: absolute;
            top: 70px;
            width: 75px;
            height: 80px;
            background: #101515;
            border-radius: 45% 45% 40% 40%;
            border: 1px solid #173d2c;
        }

        /* Eyes */
        .eyes {
            position: absolute;
            top: 98px;
            width: 55px;
            height: 12px;
            display: flex;
            justify-content: space-between;
        }

        .eyes span {
            width: 18px;
            height: 5px;
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
            transform: skewX(-20deg);
        }

        /* Mask */
        .mask {
            position: absolute;
            top: 112px;
            width: 65px;
            height: 30px;
            background: #020303;
            border: 1px solid #163b2a;
            border-radius: 5px;
        }

        /* Title */
        .title {
            margin-top: 25px;
            font-size: clamp(48px, 10vw, 95px);
            font-weight: bold;
            letter-spacing: 8px;
            color: #00ff88;
            text-shadow:
                0 0 5px #00ff88,
                0 0 15px #00ff88,
                0 0 35px rgba(0,255,136,.7);
            animation: glitch 2.5s infinite;
        }

        @keyframes glitch {
            0%, 88%, 100% {
                transform: translate(0);
            }

            90% {
                transform: translate(-4px, 2px);
                text-shadow:
                    4px 0 #ff1744,
                    -4px 0 #00ffff;
            }

            92% {
                transform: translate(4px, -2px);
                text-shadow:
                    -4px 0 #ff1744,
                    4px 0 #00ffff;
            }

            94% {
                transform: translate(0);
            }
        }

        .team {
            font-size: clamp(15px, 3vw, 22px);
            letter-spacing: 4px;
            color: #fff;
            margin-top: 5px;
        }

        .team span {
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
        }

        /* Terminal */
        .terminal {
            margin: 28px auto 0;
            max-width: 650px;
            text-align: left;
            border: 1px solid rgba(0,255,136,.25);
            background: rgba(0,0,0,.65);
            padding: 16px;
            font-size: 13px;
            line-height: 1.7;
            box-shadow: inset 0 0 20px rgba(0,255,136,.03);
        }

        .terminal-header {
            color: #777;
            border-bottom: 1px solid #16251d;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .green {
            color: #00ff88;
        }

        .red {
            color: #ff1744;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: #00ff88;
            vertical-align: middle;
            animation: cursor .7s infinite;
        }

        @keyframes cursor {
            50% {
                opacity: 0;
            }
        }

        .footer {
            margin-top: 25px;
            color: #555;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .footer strong {
            color: #00ff88;
        }

        /* Floating particles */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
            border-radius: 50%;
            animation: float 8s linear infinite;
            opacity: .5;
        }

        @keyframes float {
            from {
                transform: translateY(100vh);
                opacity: 0;
            }

            20% {
                opacity: .6;
            }

            80% {
                opacity: .6;
            }

            to {
                transform: translateY(-10vh);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 22px 15px;
                min-height: auto;
            }

            .hacker {
                width: 140px;
                height: 140px;
            }

            .title {
                letter-spacing: 3px;
            }

            .team {
                letter-spacing: 1px;
            }

            .terminal {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<div class="background"></div>

<canvas id="matrix"></canvas>

<div class="container">

    <div class="warning">
        ⚠ SYSTEM MESSAGE ⚠
    </div>

    <!-- Hacker / Black Hat Illustration -->
    <div class="hacker">
        <div class="hat"></div>
        <div class="face"></div>

        <div class="eyes">
            <span></span>
            <span></span>
        </div>

        <div class="mask"></div>
    </div>

    <div class="title" id="title">
        MR07
    </div>

    <div class="team">
        <span>KRPDXPLOIT</span> × <span>REBETEAM</span>
    </div>

    <div class="terminal">
        <div class="terminal-header">
            root@mr07:~#
        </div>

        <div>
            <span class="green">[+]</span>
            Connection established...
        </div>

        <div>
            <span class="green">[+]</span>
            Security simulation initialized.
        </div>

        <div>
            <span class="red">[!]</span>
            Your Code Is Weak To Deface
        </div>

        <div>
            <span class="green">[+]</span>
            Welcome to the MR07 zone.
        </div>

        <div>
            <span class="green">root@mr07:~#</span>
            <span id="typing"></span><span class="cursor"></span>
        </div>
    </div>

    <div class="footer">
        OWNED BY <strong>MR07</strong> •
        <strong>KRPDXPLOIT x REBETEAM</strong>
    </div>

</div>

<script>
    /* =========================
       MATRIX EFFECT
    ========================= */

    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    resizeCanvas();

    window.addEventListener("resize", resizeCanvas);

    const chars =
        "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&@<>/\\\\[]{}";

    const fontSize = 14;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1);

    function matrix() {

        ctx.fillStyle = "rgba(0, 0, 0, 0.07)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = fontSize + "px monospace";
        ctx.fillStyle = "#00ff88";

        for (let i = 0; i < drops.length; i++) {

            const text =
                chars[Math.floor(Math.random() * chars.length)];

            ctx.fillText(
                text,
                i * fontSize,
                drops[i] * fontSize
            );

            if (
                drops[i] * fontSize > canvas.height &&
                Math.random() > 0.975
            ) {
                drops[i] = 0;
            }

            drops[i]++;
        }
    }

    setInterval(matrix, 45);


    /* =========================
       TYPING EFFECT
    ========================= */

    const messages = [
        " ./mr07 --init",
        " loading cyber interface...",
        " access simulation ready...",
        " hello world."
    ];

    const typing = document.getElementById("typing");

    let messageIndex = 0;
    let charIndex = 0;
    let deleting = false;

    function typeEffect() {

        const current = messages[messageIndex];

        if (!deleting) {

            typing.textContent =
                current.substring(0, charIndex++);

            if (charIndex > current.length) {
                deleting = true;

                setTimeout(typeEffect, 1300);
                return;
            }

        } else {

            typing.textContent =
                current.substring(0, charIndex--);

            if (charIndex < 0) {
                deleting = false;
                messageIndex =
                    (messageIndex + 1) % messages.length;
            }
        }

        setTimeout(
            typeEffect,
            deleting ? 35 : 70
        );
    }

    typeEffect();


    /* =========================
       PARTICLES
    ========================= */

    function createParticle() {

        const particle =
            document.createElement("div");

        particle.className = "particle";

        particle.style.left =
            Math.random() * 100 + "vw";

        particle.style.animationDuration =
            (5 + Math.random() * 8) + "s";

        particle.style.animationDelay =
            Math.random() * 5 + "s";

        document.body.appendChild(particle);

        setTimeout(() => {
            particle.remove();
        }, 15000);
    }

    setInterval(createParticle, 250);
</script>

</body>
