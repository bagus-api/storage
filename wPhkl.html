<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <meta name="format-detection" content="telephone=no">
    <title>OtakuPlay • Us3 Enginer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #020617;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 30% 40%, #0f172a 0%, #020617 100%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(45deg, rgba(59,130,246,0.02) 0px, rgba(59,130,246,0.02) 2px, transparent 2px, transparent 8px);
            z-index: -1;
            pointer-events: none;
        }

        .app-shell {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Header - lebih ringkas untuk APK */
        .glass-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(2, 6, 23, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #e2e8f0, #60a5fa, #38bdf8);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            cursor: pointer;
        }

        .brand:active {
            opacity: 0.7;
        }

        .brand i {
            background: none;
            color: #3b82f6;
            font-size: 1.25rem;
        }

        /* NAVBAR BAWAH - DIPERKECIL UNTUK APK */
        .rounded-bottom-nav {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: 340px;
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 6px 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 200;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .rounded-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 6px 14px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            color: #64748b;
            font-size: 0.55rem;
            font-weight: 600;
            background: transparent;
        }

        .rounded-nav-item i {
            font-size: 1rem;
            margin-bottom: 1px;
        }

        .rounded-nav-item.active {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }

        .rounded-nav-item:active {
            transform: scale(0.95);
        }

        /* Main container - padding bottom disesuaikan dengan navbar kecil */
        .dynamic-stage {
            flex: 1;
            padding: 14px 16px 85px 16px;
            animation: fadeSlideUp 0.3s ease-out;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Search bar - lebih kompak */
        .neo-search {
            background: #0f172a;
            border-radius: 48px;
            border: 1px solid #1e293b;
            display: flex;
            margin-bottom: 20px;
            transition: all 0.2s;
        }
        .neo-search:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        .neo-search input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 16px;
            color: #f1f5f9;
            font-family: inherit;
            font-size: 0.8rem;
            outline: none;
        }
        .neo-search input::placeholder {
            color: #475569;
            font-size: 0.75rem;
        }
        .neo-search button {
            background: #1e293b;
            border: none;
            padding: 0 18px;
            border-radius: 48px;
            font-weight: 600;
            color: #60a5fa;
            cursor: pointer;
        }
        .neo-search button:active {
            background: #3b82f6;
            color: white;
        }

        /* Section header */
        .section-label {
            font-size: 0.9rem;
            font-weight: 700;
            margin: 18px 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-label i {
            color: #3b82f6;
            font-size: 0.9rem;
        }

        /* Horizontal scroll */
        .h-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scrollbar-width: thin;
            padding-bottom: 8px;
            scroll-snap-type: x mandatory;
        }
        .h-scroll::-webkit-scrollbar {
            height: 2px;
        }
        .h-scroll::-webkit-scrollbar-track {
            background: #0f172a;
            border-radius: 10px;
        }
        .h-scroll::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 10px;
        }

        /* Card anime - lebih ringan */
        .anime-preview {
            flex: 0 0 125px;
            background: #0f172a;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s;
            border: 1px solid #1e293b;
            scroll-snap-align: start;
        }
        .anime-preview:active {
            transform: scale(0.96);
        }
        .anime-preview img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
        }
        .preview-info {
            padding: 8px 6px;
        }
        .preview-title {
            font-weight: 600;
            font-size: 0.65rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }
        .preview-meta {
            font-size: 0.55rem;
            color: #60a5fa;
            margin-top: 4px;
        }

        /* Grid */
        .neo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .neo-grid .anime-preview {
            flex: unset;
        }

        /* Empty State - tanpa tombol aksi */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(145deg, #0f172a, #0a0f1c);
            border-radius: 24px;
            border: 1px solid #1e293b;
            margin: 20px 0;
        }
        .empty-state i {
            font-size: 3rem;
            color: #334155;
            margin-bottom: 12px;
            display: block;
        }
        .empty-state h3 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #94a3b8;
        }
        .empty-state p {
            font-size: 0.7rem;
            color: #475569;
        }

        /* Back button */
        .back-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #0f172a;
            border: 1px solid #1e293b;
            padding: 6px 16px;
            border-radius: 32px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
            color: #94a3b8;
        }
        .back-action:active {
            transform: scale(0.96);
        }

        /* Detail hero - lebih ringkas */
        .hero-detail {
            background: linear-gradient(145deg, #0f172a, #0a0f1c);
            border-radius: 24px;
            border: 1px solid #1e293b;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .hero-flex {
            display: flex;
            gap: 14px;
            padding: 16px;
            flex-wrap: wrap;
        }
        .hero-poster {
            width: 100px;
            flex-shrink: 0;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }
        .hero-poster img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
        }
        .hero-desc {
            flex: 1;
        }
        .hero-name {
            font-size: 1.1rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 4px;
        }
        .hero-badge {
            font-size: 0.6rem;
            color: #60a5fa;
            margin-bottom: 8px;
        }
        .chip-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0;
        }
        .genre-chip {
            background: #0a0f1c;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.55rem;
            font-weight: 500;
            border: 1px solid #1e293b;
            cursor: pointer;
        }
        .genre-chip:active {
            background: #2563eb;
            color: white;
        }
        .fav-trigger {
            background: #0a0f1c;
            border: 1px solid #3b82f6;
            padding: 6px 16px;
            border-radius: 32px;
            font-weight: 600;
            font-size: 0.65rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #60a5fa;
        }
        .fav-trigger.active {
            background: #3b82f6;
            color: white;
        }
        .fav-trigger:active {
            transform: scale(0.96);
        }

        /* Episode */
        .eps-panel {
            background: #0f172a;
            border-radius: 24px;
            border: 1px solid #1e293b;
            overflow: hidden;
        }
        .eps-header {
            padding: 12px 16px;
            background: #0a0f1c;
            border-bottom: 1px solid #1e293b;
            font-weight: 700;
            font-size: 0.8rem;
        }
        .eps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 10px;
            padding: 14px;
            max-height: 350px;
            overflow-y: auto;
        }
        .eps-card {
            background: #0a0f1c;
            border-radius: 16px;
            padding: 6px 4px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #1e293b;
            font-size: 0.65rem;
            font-weight: 600;
        }
        .eps-card:active {
            background: #2563eb;
            transform: scale(0.95);
            color: white;
        }

        /* Player */
        .stream-area {
            background: #0f172a;
            border-radius: 24px;
            border: 1px solid #1e293b;
            margin-bottom: 16px;
        }
        .frame-wrapper {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            position: relative;
        }
        .server-selector {
            padding: 12px;
            border-top: 1px solid #1e293b;
        }
        .server-title-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.65rem;
            font-weight: 700;
            color: #60a5fa;
        }
        .server-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .server-pill {
            background: #0a0f1c;
            border-radius: 32px;
            padding: 6px 14px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #1e293b;
            color: #cbd5e1;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .server-pill i {
            font-size: 0.65rem;
        }
        .server-pill.active {
            background: #2563eb;
            color: white;
            border-color: #3b82f6;
        }
        .server-pill:active {
            transform: scale(0.96);
        }
        .stream-status {
            text-align: center;
            font-size: 0.65rem;
            padding: 10px;
            color: #94a3b8;
        }

        /* Pagination */
        .pagi-flex {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .pagi-item {
            background: #0f172a;
            border: 1px solid #1e293b;
            width: 34px;
            height: 34px;
            border-radius: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.75rem;
        }
        .pagi-item.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }
        .pagi-item:active {
            transform: scale(0.94);
        }

        /* Watermark */
        .signature {
            text-align: center;
            font-size: 0.5rem;
            padding: 12px 12px 8px;
            color: #334155;
        }

        .skeleton-card {
            background: linear-gradient(90deg, #0f172a 25%, #1e293b 50%, #0f172a 75%);
            background-size: 200% 100%;
            animation: shimmer 1s infinite;
            border-radius: 16px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
<div class="app-shell">
    <header class="glass-header">
        <div class="brand" id="brandHome"><i class="fas fa-tv"></i> OtakuPlay</div>
    </header>

    <div class="dynamic-stage" id="rootView"></div>

    <nav class="rounded-bottom-nav">
        <div class="rounded-nav-item" data-dest="home"><i class="fas fa-compass"></i><span>Home</span></div>
        <div class="rounded-nav-item" data-dest="ongoing"><i class="fas fa-chart-line"></i><span>Ongoing</span></div>
        <div class="rounded-nav-item" data-dest="completed"><i class="fas fa-crown"></i><span>Complete</span></div>
        <div class="rounded-nav-item" data-dest="favorite"><i class="fas fa-bookmark"></i><span>Library</span></div>
    </nav>

    <div class="signature"><i class="fas fa-microchip"></i> Vinzx • Us3 Enginer</div>
</div>

<script>
(function() {
    const API_BASE = 'https://www.sankavollerei.com/anime';
    const FAV_KEY = 'animeplay_favs_v3';

    let ongoingCurr = 1, ongoingMax = 1;
    let completedCurr = 1, completedMax = 1;
    const cacheStore = new Map();

    async function fetcher(endpoint, params = {}) {
        let url = `${API_BASE}${endpoint}`;
        if(Object.keys(params).length) url += `?${new URLSearchParams(params)}`;
        if(cacheStore.has(url)) return cacheStore.get(url);
        try {
            const resp = await fetch(url, {headers: {Accept: 'application/json'}});
            if(!resp.ok) return null;
            const json = await resp.json();
            cacheStore.set(url, json);
            setTimeout(() => cacheStore.delete(url), 300000);
            return json;
        } catch(e) { return null; }
    }

    const api = {
        home: () => fetcher('/home'),
        ongoing: (p) => fetcher('/ongoing-anime', {page: p}),
        completed: (p) => fetcher('/complete-anime', {page: p}),
        detail: (slug) => fetcher(`/anime/${slug}`),
        episode: (id) => fetcher(`/episode/${id}`),
        server: (id) => fetcher(`/server/${id}`),
        search: (q) => fetcher(`/search/${encodeURIComponent(q)}`)
    };

    function getFavs() { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); }
    function saveFavs(arr) { localStorage.setItem(FAV_KEY, JSON.stringify(arr)); }
    function toggleFav(id, title, poster) {
        let list = getFavs();
        const exists = list.find(f => f.id === id);
        if(exists) {
            list = list.filter(f => f.id !== id);
            saveFavs(list);
            return false;
        } else {
            list.unshift({id, title, poster});
            saveFavs(list);
            return true;
        }
    }
    function isFav(id) { return getFavs().some(f => f.id === id); }

    function getImageUrl(raw) {
        if(!raw) return 'https://placehold.co/300x450/0f172a/3b82f6?text=No+Cover';
        if(raw.startsWith('http')) return raw;
        if(raw.startsWith('/')) return 'https://www.sankavollerei.com' + raw;
        return 'https://placehold.co/300x450/0f172a/3b82f6?text=Error';
    }

    function sanitize(str) { if(!str) return ''; let d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

    function renderCard(anime) {
        const id = anime.animeId || anime.id || anime.slug;
        const title = anime.title || anime.name || 'Anime';
        const poster = getImageUrl(anime.poster || anime.image);
        const eps = anime.episodes || '';
        return `<div class="anime-preview" data-id="${sanitize(id)}">
                    <img src="${poster}" loading="lazy" onerror="this.src='https://placehold.co/300x450/0f172a/3b82f6?text=Cover+Error'">
                    <div class="preview-info">
                        <div class="preview-title">${sanitize(title)}</div>
                        ${eps ? `<div class="preview-meta"><i class="fas fa-film"></i> ${eps}</div>` : ''}
                    </div>
                </div>`;
    }

    function bindCards(container = document) {
        container.querySelectorAll('.anime-preview').forEach(card => {
            const id = card.dataset.id;
            if(!id) return;
            card.removeEventListener('click', card._clickHandler);
            card._clickHandler = () => navigate('detail', id);
            card.addEventListener('click', card._clickHandler);
        });
    }

    function buildPagination(curr, total, type) {
        if(total <= 1) return '';
        let html = `<div class="pagi-flex">`;
        if(curr > 1) html += `<div class="pagi-item" data-paginate="${type}_prev"><i class="fas fa-chevron-left"></i></div>`;
        let start = Math.max(1, curr-2);
        let end = Math.min(total, curr+2);
        for(let i=start; i<=end; i++) html += `<div class="pagi-item ${i===curr ? 'active' : ''}" data-paginate="${type}_${i}">${i}</div>`;
        if(curr < total) html += `<div class="pagi-item" data-paginate="${type}_next"><i class="fas fa-chevron-right"></i></div>`;
        html += `</div>`;
        return html;
    }

    async function renderHome() {
        const root = document.getElementById('rootView');
        root.innerHTML = `<div class="neo-search"><input type="text" id="globalSearch" placeholder="Cari anime..."><button id="searchExec"><i class="fas fa-search"></i></button></div>
            <div class="section-label"><i class="fas fa-fire"></i> Trending Now</div><div class="h-scroll" id="trendRow"><div class="skeleton-card" style="width:125px;height:190px;"></div></div>
            <div class="section-label"><i class="fas fa-check-double"></i> Hot Complete</div><div class="h-scroll" id="completeRow"><div class="skeleton-card" style="width:125px;height:190px;"></div></div>`;
        const data = await api.home();
        const ongoingList = data?.data?.ongoing?.animeList || [];
        const completedList = data?.data?.completed?.animeList || [];
        document.getElementById('trendRow').innerHTML = ongoingList.slice(0,10).map(renderCard).join('');
        document.getElementById('completeRow').innerHTML = completedList.slice(0,10).map(renderCard).join('');
        bindCards();

        const searchInput = document.getElementById('globalSearch');
        const searchBtn = document.getElementById('searchExec');
        const doSearch = async () => {
            const q = searchInput.value.trim();
            if(!q) return;
            root.innerHTML = `<div class="back-action" id="searchBack"><i class="fas fa-arrow-left"></i> Back</div><div class="section-label"><i class="fas fa-search"></i> Hasil: ${sanitize(q)}</div><div class="neo-grid" id="searchGrid"><div class="skeleton-card" style="height:190px;"></div></div>`;
            const res = await api.search(q);
            const items = res?.data?.animeList || res?.data || [];
            const gridHtml = items.length ? items.map(renderCard).join('') : '<div class="empty-state"><i class="fas fa-search"></i><h3>Tidak Ditemukan</h3><p>Tidak ada hasil untuk pencarian anda</p></div>';
            document.getElementById('searchGrid').innerHTML = gridHtml;
            document.getElementById('searchBack')?.addEventListener('click', () => navigate('home'));
            bindCards();
        };
        searchBtn.onclick = doSearch;
        searchInput.onkeypress = (e) => { if(e.key === 'Enter') doSearch(); };
    }

    async function loadOngoing(page = 1) {
        const root = document.getElementById('rootView');
        root.innerHTML = `<div class="back-action" id="backHome"><i class="fas fa-arrow-left"></i> Back</div><div class="section-label"><i class="fas fa-chart-line"></i> Ongoing Series</div><div class="neo-grid" id="ongoingGrid">${'<div class="skeleton-card" style="height:190px;"></div>'.repeat(4)}</div><div id="pagiSlot"></div>`;
        const res = await api.ongoing(page);
        const list = res?.data?.animeList || res?.data || [];
        ongoingMax = res?.pagination?.totalPages || 1;
        ongoingCurr = page;
        document.getElementById('ongoingGrid').innerHTML = list.length ? list.map(renderCard).join('') : '<div class="empty-state"><i class="fas fa-folder-open"></i><h3>Kosong</h3><p>Tidak ada anime ongoing</p></div>';
        document.getElementById('pagiSlot').innerHTML = buildPagination(ongoingCurr, ongoingMax, 'ongoing');
        document.getElementById('backHome').onclick = () => navigate('home');
        bindCards();
        attachPaginationEvents('ongoing');
    }

    async function loadCompleted(page = 1) {
        const root = document.getElementById('rootView');
        root.innerHTML = `<div class="back-action" id="backHomeComp"><i class="fas fa-arrow-left"></i> Back</div><div class="section-label"><i class="fas fa-crown"></i> Completed Anime</div><div class="neo-grid" id="compGrid">${'<div class="skeleton-card" style="height:190px;"></div>'.repeat(4)}</div><div id="compPagi"></div>`;
        const res = await api.completed(page);
        const list = res?.data?.animeList || res?.data || [];
        completedMax = res?.pagination?.totalPages || 1;
        completedCurr = page;
        document.getElementById('compGrid').innerHTML = list.length ? list.map(renderCard).join('') : '<div class="empty-state"><i class="fas fa-check-circle"></i><h3>Kosong</h3><p>Tidak ada anime completed</p></div>';
        document.getElementById('compPagi').innerHTML = buildPagination(completedCurr, completedMax, 'completed');
        document.getElementById('backHomeComp').onclick = () => navigate('home');
        bindCards();
        attachPaginationEvents('completed');
    }

    function attachPaginationEvents(type) {
        document.querySelectorAll('[data-paginate]').forEach(el => {
            const val = el.dataset.paginate;
            el.onclick = () => {
                if(type === 'ongoing') {
                    if(val === 'ongoing_prev') loadOngoing(ongoingCurr-1);
                    else if(val === 'ongoing_next') loadOngoing(ongoingCurr+1);
                    else if(val.startsWith('ongoing_')) loadOngoing(parseInt(val.split('_')[1]));
                } else if(type === 'completed') {
                    if(val === 'completed_prev') loadCompleted(completedCurr-1);
                    else if(val === 'completed_next') loadCompleted(completedCurr+1);
                    else if(val.startsWith('completed_')) loadCompleted(parseInt(val.split('_')[1]));
                }
            };
        });
    }

    async function loadDetail(id) {
        const root = document.getElementById('rootView');
        root.innerHTML = `<div class="back-action" id="detailBack"><i class="fas fa-arrow-left"></i> Back</div><div class="skeleton-card" style="height:240px;border-radius:24px;"></div>`;
        const res = await api.detail(id);
        const d = res?.data?.details || res?.data;
        if(!d) { root.innerHTML = `<div class="back-action" id="detailBack">Back</div><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Gagal Memuat</h3><p>Detail tidak ditemukan</p></div>`; document.getElementById('detailBack').onclick = () => navigate('home'); return; }
        
        let episodes = d.episodeList || [];
        episodes = episodes.map((ep,i) => ({...ep, epNum: (ep.eps && !isNaN(parseInt(ep.eps))) ? parseInt(ep.eps) : (ep.episode_number||i+1), epId: ep.episodeId || ep.slug || ep.id})).sort((a,b)=>a.epNum-b.epNum);
        const poster = getImageUrl(d.poster || d.image);
        const favActive = isFav(id);
        
        let html = `<div class="back-action" id="detailBackInner"><i class="fas fa-arrow-left"></i> Back</div>
        <div class="hero-detail">
            <div class="hero-flex">
                <div class="hero-poster"><img src="${poster}" onerror="this.src='https://placehold.co/300x450/0f172a/3b82f6?text=Error'"></div>
                <div class="hero-desc">
                    <div class="hero-name">${sanitize(d.title)}</div>
                    <div class="hero-badge"><i class="fas fa-tag"></i> ${d.status || 'Ongoing'} • ${episodes.length} eps</div>
                    <div class="chip-container" id="genreChipList">${(d.genreList||[]).map(g => `<span class="genre-chip" data-genre="${g.genreId||g.name}">${sanitize(g.name||g.title)}</span>`).join('')}</div>
                    <div class="fav-trigger ${favActive ? 'active' : ''}" id="favDetailBtn"><i class="fas fa-heart"></i> ${favActive ? 'Saved' : 'Save'}</div>
                </div>
            </div>
        </div>
        <div class="eps-panel">
            <div class="eps-header"><i class="fas fa-list-ul"></i> Episode List</div>
            <div class="eps-grid" id="epsListGrid">${episodes.map(ep => `<div class="eps-card" data-ep="${ep.epId}">Ep ${ep.epNum}</div>`).join('')}</div>
        </div>`;
        root.innerHTML = html;
        document.getElementById('detailBackInner').onclick = () => navigate('home');
        document.querySelectorAll('.genre-chip').forEach(chip => chip.onclick = () => navigate('genre', chip.dataset.genre));
        const favBtn = document.getElementById('favDetailBtn');
        if(favBtn) favBtn.onclick = () => {
            const added = toggleFav(id, d.title, poster);
            favBtn.classList.toggle('active', added);
            favBtn.innerHTML = `<i class="fas fa-heart"></i> ${added ? 'Saved' : 'Save'}`;
        };
        document.querySelectorAll('.eps-card').forEach(ep => ep.onclick = () => navigate('episode', ep.dataset.ep));
    }

    async function loadEpisode(epId) {
        const root = document.getElementById('rootView');
        root.innerHTML = `<div class="back-action" id="epBackBtn"><i class="fas fa-arrow-left"></i> Back</div>
        <div class="stream-area">
            <div class="frame-wrapper" id="playerContainer">
                <div id="playerOverlay" style="display:flex;align-items:center;justify-content:center;height:100%;background:#000;color:#60a5fa;"><i class="fas fa-circle-notch fa-spin"></i> Loading</div>
                <iframe id="streamFrame" style="display:none;width:100%;height:100%;border:none;" allowfullscreen></iframe>
            </div>
            <div class="server-selector">
                <div class="server-title-bar"><span><i class="fas fa-server"></i> Server</span><span><i class="fas fa-hd"></i> 720p</span></div>
                <div class="server-buttons" id="serverButtons"></div>
            </div>
            <div class="stream-status" id="streamMsg"></div>
        </div>`;
        
        const epRes = await api.episode(epId);
        const ep = epRes?.data?.details || epRes?.data;
        if(!ep) { root.innerHTML = `<div class="back-action" id="epBackBtn">Back</div><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Episode Error</h3><p>Tidak dapat memuat episode</p></div>`; document.getElementById('epBackBtn').onclick = () => navigate('home'); return; }
        
        let allServers = [];
        if(ep.server && ep.server.qualities) {
            ep.server.qualities.forEach(q => {
                if(q.serverList) q.serverList.forEach(s => allServers.push({id: s.serverId, name: s.title, quality: q.title}));
            });
        }
        const filtered = allServers.filter(s => !(s.quality || '').toLowerCase().includes('480') && !(s.quality || '').toLowerCase().includes('360'));
        const finalServers = filtered.length ? filtered : allServers;
        const server720 = finalServers.filter(s => (s.quality||'').toLowerCase().includes('720'));
        const other = finalServers.filter(s => !(s.quality||'').toLowerCase().includes('720'));
        const sorted = [...server720, ...other];
        
        const container = document.getElementById('serverButtons');
        if(sorted.length === 0) { container.innerHTML = '<span style="color:#ef4444;font-size:0.7rem;">No server</span>'; return; }
        container.innerHTML = sorted.map(s => `<div class="server-pill" data-srv="${s.id}"><i class="fas ${(s.quality||'').includes('720') ? 'fa-crown' : 'fa-play'}"></i> ${sanitize(s.name)}</div>`).join('');
        
        const playServer = async (serverId, btnElem) => {
            document.querySelectorAll('.server-pill').forEach(b => b.classList.remove('active'));
            if(btnElem) btnElem.classList.add('active');
            const overlay = document.getElementById('playerOverlay');
            const iframe = document.getElementById('streamFrame');
            const msgDiv = document.getElementById('streamMsg');
            msgDiv.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Connecting...';
            overlay.style.display = 'flex';
            overlay.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Loading stream';
            iframe.style.display = 'none';
            try {
                const srvData = await api.server(serverId);
                const url = srvData?.data?.streamingUrl || srvData?.data?.url;
                if(url && url.trim()) {
                    iframe.src = url;
                    iframe.style.display = 'block';
                    overlay.style.display = 'none';
                    msgDiv.innerHTML = '<i class="fas fa-check-circle"></i> Stream active';
                } else {
                    throw new Error('No stream');
                }
            } catch(e) {
                overlay.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Stream error';
                msgDiv.innerHTML = '<i class="fas fa-times-circle"></i> Failed';
            }
        };
        
        document.querySelectorAll('.server-pill').forEach(btn => {
            btn.onclick = () => playServer(btn.dataset.srv, btn);
        });
        if(sorted.length) setTimeout(() => { const first = document.querySelector('.server-pill'); if(first) playServer(first.dataset.srv, first); }, 80);
        document.getElementById('epBackBtn').onclick = () => navigate('home');
    }

    async function loadFavorites() {
        const favs = getFavs();
        const root = document.getElementById('rootView');
        let html = `<div class="back-action" id="favBack"><i class="fas fa-arrow-left"></i> Back</div><div class="section-label"><i class="fas fa-bookmark"></i> My Collection</div>`;
        if(!favs.length) {
            html += `<div class="empty-state">
                        <i class="fas fa-heart-broken"></i>
                        <h3>Belum Ada Favorit</h3>
                        <p>Tambahkan anime ke koleksi favoritmu</p>
                     </div>`;
        } else {
            html += `<div class="neo-grid">${favs.map(f => `<div class="anime-preview" data-id="${sanitize(f.id)}"><img src="${f.poster}" onerror="this.src='https://placehold.co/300x450/0f172a/3b82f6?text=Cover'"><div class="preview-info"><div class="preview-title">${sanitize(f.title)}</div><div class="preview-meta"><i class="fas fa-star"></i> Favorit</div></div></div>`).join('')}</div>`;
        }
        root.innerHTML = html;
        document.getElementById('favBack').onclick = () => navigate('home');
        bindCards();
    }

    window.navigate = (page, param = null) => {
        document.querySelectorAll('.rounded-nav-item').forEach(nav => nav.classList.toggle('active', nav.dataset.dest === page));
        if(page === 'home') renderHome();
        else if(page === 'ongoing') loadOngoing(1);
        else if(page === 'completed') loadCompleted(1);
        else if(page === 'favorite') loadFavorites();
        else if(page === 'detail') loadDetail(param);
        else if(page === 'episode') loadEpisode(param);
        window.scrollTo({top: 0, behavior: 'smooth'});
    };

    document.querySelectorAll('.rounded-nav-item').forEach(nav => nav.addEventListener('click', () => navigate(nav.dataset.dest)));
    document.getElementById('brandHome')?.addEventListener('click', () => navigate('home'));
    renderHome();
})();
</script>
</body>
</html>
