<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BINTANG DETEKTOR</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --red:    #ff2d2d;
  --red2:   #ff6b35;
  --dark:   #0d0a0a;
  --dark2:  #150f0f;
  --card:   #1a1010;
  --border: #2e1a1a;
  --text:   #f0e8e8;
  --muted:  #6b4a4a;
  --white:  #fff;
}

body {
  background: var(--dark);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* Noise texture overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 100;
  opacity: 0.4;
}

/* Ambient red glow top */
body::before {
  content: '';
  position: fixed;
  top: -200px; left: 50%;
  transform: translateX(-50%);
  width: 600px; height: 400px;
  background: radial-gradient(ellipse, rgba(255,45,45,0.12) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 100%;
  padding: 16px 12px 40px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ── HEADER ── */
.header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.header-left {}
.brand {
  font-size: 10px;
  letter-spacing: 0.35em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 4px;
}
.title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 42px;
  line-height: 0.95;
  color: var(--white);
  letter-spacing: 0.02em;
}
.title span {
  color: var(--red);
  display: block;
}
.header-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  padding-top: 4px;
}
.version-tag {
  background: var(--border);
  border: 1px solid #3d2020;
  border-radius: 4px;
  padding: 3px 8px;
  font-size: 9px;
  letter-spacing: 0.15em;
  color: var(--muted);
}
.live-dot {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 9px;
  letter-spacing: 0.15em;
  color: var(--muted);
}
.live-dot::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--muted);
  transition: background 0.3s;
}
.live-dot.on { color: var(--red); }
.live-dot.on::before {
  background: var(--red);
  box-shadow: 0 0 8px var(--red);
  animation: pulse-dot 1s infinite;
}
@keyframes pulse-dot {
  0%,100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ── CAMERA VIEWPORT ── */
.viewport {
  position: relative;
  width: 100%;
  aspect-ratio: 3/4;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
  border: 1px solid var(--border);
}
.viewport::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(255,45,45,0.3), transparent 50%, rgba(255,45,45,0.1));
  pointer-events: none;
  z-index: 10;
}

#video {
  position: absolute;
  inset: 0; width: 100%; height: 100%;
  object-fit: cover;
}
#overlay {
  position: absolute;
  inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 5;
}

/* Corner brackets */
.vp-corner {
  position: absolute;
  width: 20px; height: 20px;
  border-color: var(--red);
  border-style: solid;
  z-index: 8;
  opacity: 0.8;
}
.vp-corner.tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
.vp-corner.tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
.vp-corner.bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
.vp-corner.br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

/* Scan line */
.scan-line {
  position: absolute;
  left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--red), transparent);
  z-index: 7;
  opacity: 0;
  top: 0;
}
.scan-line.active {
  opacity: 1;
  animation: scan-move 2s linear infinite;
}
@keyframes scan-move {
  0%   { top: 0%; }
  100% { top: 100%; }
}

/* Top-left status */
.vp-status {
  position: absolute;
  top: 12px; left: 12px;
  z-index: 9;
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(13,10,10,0.82);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 9px;
  letter-spacing: 0.18em;
  color: var(--muted);
  backdrop-filter: blur(8px);
  transition: all 0.3s;
}
.vp-status.ready  { color: #6dffb3; border-color: rgba(109,255,179,0.3); }
.vp-status.active { color: var(--red); border-color: rgba(255,45,45,0.4); }
.vp-status.err    { color: #ff8080; border-color: rgba(255,128,128,0.3); }
.vp-status-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}
.vp-status.active .vp-status-dot { animation: pulse-dot 0.8s infinite; }

/* Bottom-right counter */
.count-bubble {
  position: absolute;
  bottom: 12px; right: 12px;
  z-index: 9;
  background: rgba(13,10,10,0.88);
  border: 1.5px solid var(--red);
  border-radius: 10px;
  padding: 10px 16px;
  text-align: center;
  display: none;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 24px rgba(255,45,45,0.25), inset 0 0 12px rgba(255,45,45,0.05);
}
.count-bubble.show { display: block; }
.count-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 40px;
  line-height: 1;
  color: var(--red);
  text-shadow: 0 0 20px rgba(255,45,45,0.7);
}
.count-lbl {
  font-size: 8px;
  letter-spacing: 0.25em;
  color: rgba(255,100,100,0.7);
  margin-top: 1px;
}

/* FPS */
.vp-fps {
  position: absolute;
  bottom: 12px; left: 12px;
  z-index: 9;
  font-size: 9px;
  letter-spacing: 0.12em;
  color: rgba(255,45,45,0.3);
}

/* ── CAMERA SWITCHER ── */
.cam-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.cam-btn {
  padding: 11px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}
.cam-btn:hover { border-color: rgba(255,45,45,0.4); color: var(--text); }
.cam-btn.active {
  background: rgba(255,45,45,0.08);
  border-color: var(--red);
  color: var(--red);
  box-shadow: 0 0 12px rgba(255,45,45,0.1);
}
.cam-icon {
  width: 14px; height: 14px;
  border: 1.5px solid currentColor;
  border-radius: 3px;
  position: relative;
  flex-shrink: 0;
}
.cam-icon::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.6;
}

/* ── MAIN BTN ── */
.btn-main {
  width: 100%;
  padding: 18px;
  border: none;
  border-radius: 10px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  letter-spacing: 0.15em;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
  background: var(--red);
  color: #fff;
  box-shadow: 0 4px 24px rgba(255,45,45,0.35);
}
.btn-main::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
  pointer-events: none;
}
.btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(255,45,45,0.5); }
.btn-main:active { transform: translateY(0); }
.btn-main.stop {
  background: var(--card);
  color: var(--red);
  border: 1.5px solid var(--red);
  box-shadow: 0 4px 20px rgba(255,45,45,0.15);
}
.btn-main:disabled {
  background: var(--border);
  color: var(--muted);
  box-shadow: none;
  cursor: not-allowed;
  transform: none;
}

/* ── STATS PANEL ── */
.stats-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.stats-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.stats-title {
  font-size: 9px;
  letter-spacing: 0.3em;
  color: var(--muted);
  text-transform: uppercase;
}
.stats-badge {
  font-size: 9px;
  letter-spacing: 0.12em;
  color: var(--muted);
  background: var(--border);
  padding: 2px 8px;
  border-radius: 4px;
}

.stats-body {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
}
.stat-item {
  padding: 16px 14px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.stat-item:last-child { border-right: none; }
.stat-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  line-height: 1;
  color: var(--red);
}
.stat-val.big { font-size: 48px; }
.stat-lbl {
  font-size: 8px;
  letter-spacing: 0.2em;
  color: var(--muted);
  text-transform: uppercase;
  line-height: 1.4;
}

.stats-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.05em;
  min-height: 38px;
  display: flex;
  align-items: center;
}

/* ── LOADING BAR ── */
.loading-bar {
  height: 2px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.loading-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--red), var(--red2));
  border-radius: 2px;
  width: 0%;
  transition: width 0.4s ease;
  position: relative;
}
.loading-bar-fill::after {
  content: '';
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 40px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4));
  animation: shimmer 1s infinite;
}
@keyframes shimmer {
  0%   { opacity: 0; }
  50%  { opacity: 1; }
  100% { opacity: 0; }
}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="brand">Bintang Tools</div>
      <div class="title">DETEKTOR<span>ORANG</span></div>
    </div>
    <div class="header-right">
      <div class="version-tag">v2.0</div>
      <div class="live-dot" id="liveDot">OFFLINE</div>
    </div>
  </div>

  <!-- LOADING BAR -->
  <div class="loading-bar">
    <div class="loading-bar-fill" id="loadBar"></div>
  </div>

  <!-- VIEWPORT -->
  <div class="viewport">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="vp-corner tl"></div>
    <div class="vp-corner tr"></div>
    <div class="vp-corner bl"></div>
    <div class="vp-corner br"></div>
    <div class="scan-line" id="scanLine"></div>
    <div class="vp-status" id="vpStatus">
      <div class="vp-status-dot"></div>
      <span id="vpStatusText">MEMUAT MODEL...</span>
    </div>
    <div class="count-bubble" id="countBubble">
      <div class="count-num" id="countNum">0</div>
      <div class="count-lbl">ORANG</div>
    </div>
    <div class="vp-fps" id="vpFps"></div>
  </div>

  <!-- CAMERA SWITCH -->
  <div class="cam-switch">
    <button class="cam-btn" id="btnFront" onclick="switchCam('user')">
      <div class="cam-icon"></div> KAMERA DEPAN
    </button>
    <button class="cam-btn active" id="btnBack" onclick="switchCam('environment')">
      <div class="cam-icon"></div> KAMERA BELAKANG
    </button>
  </div>

  <!-- MAIN BUTTON -->
  <button class="btn-main" id="btnMain" onclick="toggleDeteksi()" disabled>
    MULAI DETEKSI
  </button>

  <!-- STATS PANEL -->
  <div class="stats-panel">
    <div class="stats-header">
      <div class="stats-title">Hasil Deteksi</div>
      <div class="stats-badge" id="statsBadge">STANDBY</div>
    </div>
    <div class="stats-body">
      <div class="stat-item">
        <div class="stat-val big" id="statCount">—</div>
        <div class="stat-lbl">Orang<br>Terdeteksi</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="statConf">—</div>
        <div class="stat-lbl">Confidence<br>Tertinggi</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="statMax">—</div>
        <div class="stat-lbl">Max Sesi<br>Ini</div>
      </div>
    </div>
    <div class="stats-footer" id="statsFooter">
      Tekan MULAI DETEKSI untuk memulai.
    </div>
  </div>

</div>

<script>
let stream = null, model = null, running = false, animId = null;
let facingMode = 'environment', lastTime = 0;
let sessionMax = 0;

const video       = document.getElementById('video');
const overlay     = document.getElementById('overlay');
const ctx         = overlay.getContext('2d');
const btnMain     = document.getElementById('btnMain');
const vpStatus    = document.getElementById('vpStatus');
const vpStatusTxt = document.getElementById('vpStatusText');
const liveDot     = document.getElementById('liveDot');
const scanLine    = document.getElementById('scanLine');
const countBubble = document.getElementById('countBubble');
const countNum    = document.getElementById('countNum');
const vpFps       = document.getElementById('vpFps');
const statCount   = document.getElementById('statCount');
const statConf    = document.getElementById('statConf');
const statMax     = document.getElementById('statMax');
const statsFooter = document.getElementById('statsFooter');
const statsBadge  = document.getElementById('statsBadge');
const loadBar     = document.getElementById('loadBar');

// ── STATUS ──
function setStatus(text, type = '') {
  vpStatusTxt.textContent = text;
  vpStatus.className = 'vp-status ' + type;
}

// ── KAMERA ──
async function startCam(facing) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  facingMode = facing;

  const attempts = [
    { video: { facingMode: { exact: facing }, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false },
    { video: { facingMode: facing }, audio: false },
    { video: true, audio: false }
  ];

  for (const c of attempts) {
    try {
      stream = await navigator.mediaDevices.getUserMedia(c);
      video.srcObject = stream;
      await video.play();
      if (model) {
        setStatus('SIAP', 'ready');
        btnMain.disabled = false;
      }
      return;
    } catch(e) { continue; }
  }
  setStatus('KAMERA GAGAL', 'err');
  statsFooter.textContent = 'Gagal akses kamera. Pastikan HTTPS & izinkan kamera di browser.';
}

function switchCam(facing) {
  document.getElementById('btnFront').classList.toggle('active', facing === 'user');
  document.getElementById('btnBack').classList.toggle('active', facing === 'environment');
  if (running) stopDeteksi();
  startCam(facing);
}

// ── TOGGLE ──
function toggleDeteksi() {
  running ? stopDeteksi() : startDeteksi();
}

function startDeteksi() {
  if (!model) return;
  running = true;
  sessionMax = 0;
  btnMain.textContent = 'STOP DETEKSI';
  btnMain.classList.add('stop');
  setStatus('MENDETEKSI', 'active');
  liveDot.textContent = 'LIVE';
  liveDot.classList.add('on');
  countBubble.classList.add('show');
  scanLine.classList.add('active');
  statsBadge.textContent = 'AKTIF';
  loop();
}

function stopDeteksi() {
  running = false;
  clearTimeout(animId); isProcessing = false;
  btnMain.textContent = 'MULAI DETEKSI';
  btnMain.classList.remove('stop');
  setStatus('SIAP', 'ready');
  liveDot.textContent = 'OFFLINE';
  liveDot.classList.remove('on');
  countBubble.classList.remove('show');
  scanLine.classList.remove('active');
  statsBadge.textContent = 'SELESAI';
  vpFps.textContent = '';
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  statsFooter.textContent = `Sesi selesai. Max terdeteksi: ${sessionMax} orang.`;
}

// LOOP
let isProcessing = false;

function drawBoxes(people) {
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  const scaleX = overlay.width  / (video.videoWidth  || overlay.width);
  const scaleY = overlay.height / (video.videoHeight || overlay.height);
  people.forEach((p, i) => {
    let [x, y, w, h] = p.bbox;
    x *= scaleX; y *= scaleY; w *= scaleX; h *= scaleY;
    const pct = Math.round(p.score * 100);
    ctx.shadowColor = '#ff2d2d'; ctx.shadowBlur = 16;
    ctx.strokeStyle = '#ff2d2d'; ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,120,120,0.5)'; ctx.lineWidth = 1;
    ctx.strokeRect(x+2, y+2, w-4, h-4);
    const cs = 14;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
    ctx.shadowColor = '#ff2d2d'; ctx.shadowBlur = 5;
    ctx.beginPath(); ctx.moveTo(x,y+cs); ctx.lineTo(x,y); ctx.lineTo(x+cs,y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+w-cs,y); ctx.lineTo(x+w,y); ctx.lineTo(x+w,y+cs); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,y+h-cs); ctx.lineTo(x,y+h); ctx.lineTo(x+cs,y+h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+w-cs,y+h); ctx.lineTo(x+w,y+h); ctx.lineTo(x+w,y+h-cs); ctx.stroke();
    ctx.shadowBlur = 0;
    const label = `ORANG ${i+1}`;
    ctx.font = 'bold 11px monospace';
    const lw = ctx.measureText(label).width + 48;
    const labelH = 32;
    const labelY = y > labelH + 4 ? y - labelH - 4 : y + h + 4;
    ctx.fillStyle = 'rgba(255,45,45,0.92)';
    ctx.beginPath(); ctx.roundRect(x, labelY, lw, labelH, 4); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px monospace';
    ctx.fillText(label, x+8, labelY+13);
    ctx.fillStyle = 'rgba(255,255,255,0.65)'; ctx.font = '10px monospace';
    ctx.fillText(pct+'%', x+8, labelY+25);
  });
}

async function runDetect() {
  if (!running || isProcessing) return;
  isProcessing = true;
  if (overlay.width !== video.videoWidth) {
    overlay.width  = video.videoWidth  || 640;
    overlay.height = video.videoHeight || 480;
  }
  try {
    const t0 = performance.now();
    const preds  = await model.detect(video, 20, 0.3);
    const people = preds.filter(p => p.class === 'person' && p.score > 0.3);
    const elapsed = Math.round(performance.now() - t0);
    drawBoxes(people);
    const n = people.length;
    if (n > sessionMax) sessionMax = n;
    countNum.textContent  = n;
    statCount.textContent = n;
    statMax.textContent   = sessionMax;
    vpFps.textContent     = elapsed + 'ms';
    if (n > 0) {
      const best = Math.round(Math.max(...people.map(p => p.score)) * 100);
      statConf.textContent  = best + '%';
      statsFooter.textContent = `${n} orang terdeteksi dalam frame.`;
    } else {
      statConf.textContent  = '—';
      statsFooter.textContent = 'Tidak ada orang terdeteksi. Arahkan kamera ke orang.';
    }
  } catch(e) {}
  isProcessing = false;
}

function loop() {
  if (!running) return;
  runDetect();
  animId = setTimeout(loop, 300);
}

// ── INIT ──
// Animate loading bar
let prog = 0;
const loadInterval = setInterval(() => {
  prog = Math.min(prog + Math.random() * 15, 85);
  loadBar.style.width = prog + '%';
}, 300);

cocoSsd.load({ base: 'mobilenet_v2' }).then(m => {
  clearInterval(loadInterval);
  loadBar.style.width = '100%';
  setTimeout(() => loadBar.style.opacity = '0', 600);

  model = m;
  setStatus('SIAP', 'ready');
  statsFooter.textContent = 'Model siap. Tekan MULAI DETEKSI.';
  startCam('environment');
}).catch(e => {
  clearInterval(loadInterval);
  setStatus('MODEL GAGAL', 'err');
  statsFooter.textContent = 'Gagal muat model: ' + e.message;
});
</script>
