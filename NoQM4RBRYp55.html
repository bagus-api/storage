<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kalkulator Sederhana</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e1e2f;
    font-family: Arial, sans-serif;
  }
  .calculator {
    background: #2b2b3d;
    border-radius: 16px;
    padding: 20px;
    width: 280px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  #display {
    width: 100%;
    height: 60px;
    background: #12121c;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 28px;
    text-align: right;
    padding: 0 15px;
    margin-bottom: 15px;
    box-sizing: border-box;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    padding: 18px 0;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: #3a3a52;
    color: #fff;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #4a4a68; }
  button.operator { background: #ff9500; }
  button.operator:hover { background: #ffab33; }
  button.equal { background: #34c759; grid-column: span 2; }
  button.equal:hover { background: #4ade80; }
  button.clear { background: #ff3b30; }
  button.clear:hover { background: #ff6259; }
</style>
</head>
<body>

<div class="calculator">
  <input type="text" id="display" disabled value="0">
  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="deleteLast()">⌫</button>
    <button class="operator" onclick="append('%')">%</button>
    <button class="operator" onclick="append('/')">÷</button>

    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button class="operator" onclick="append('*')">×</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button class="operator" onclick="append('-')">−</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button class="operator" onclick="append('+')">+</button>

    <button onclick="append('0')">0</button>
    <button onclick="append('.')">.</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>
</div>

<script>
  let display = document.getElementById('display');
  let current = '0';

  function updateDisplay() {
    display.value = current;
  }

  function append(val) {
    if (current === '0' && !'+-*/%.'.includes(val)) {
      current = val;
    } else {
      current += val;
    }
    updateDisplay();
  }

  function clearDisplay() {
    current = '0';
    updateDisplay();
  }

  function deleteLast() {
    current = current.length > 1 ? current.slice(0, -1) : '0';
    updateDisplay();
  }

  function calculate() {
    try {
      // ganti % jadi /100 sederhana
      let expr = current.replace(/%/g, '/100');
      let result = Function('"use strict";return (' + expr + ')')();
      current = String(result);
      updateDisplay();
    } catch (e) {
      current = 'Error';
      updateDisplay();
    }
  }
</script>

</body>
</html>
