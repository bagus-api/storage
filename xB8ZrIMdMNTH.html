<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#021a12">
<title>TOOLS BUDIZS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --p:#22c55e;--pd:#16a34a;--bg:#021a12;--card:rgba(6,30,20,0.88);
  --bd:rgba(34,197,94,0.25);--txt:#d1fae5;--mut:#5a8a6e;--ibg:rgba(34,197,94,0.06);
}
html,body{height:100%;}
body{background:var(--bg);font-family:'Poppins',sans-serif;color:var(--txt);overflow-x:hidden;}

/* Background */
.nx-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 20% 50%,rgba(34,197,94,0.18) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(16,185,129,0.12) 0%,transparent 50%),radial-gradient(ellipse at 50% 100%,rgba(5,150,105,0.14) 0%,transparent 50%),#021a12;}
.nx-bg::before{content:'';position:absolute;inset:-80px;background-image:linear-gradient(rgba(34,197,94,0.07) 1px,transparent 1px),linear-gradient(90deg,rgba(34,197,94,0.07) 1px,transparent 1px);background-size:54px 54px;opacity:0.55;animation:nxGrid 8s ease-in-out infinite alternate;}
@keyframes nxGrid{0%{transform:perspective(900px) rotateX(0deg) translateY(0);}100%{transform:perspective(900px) rotateX(2deg) translateY(-10px);}}
.nx-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(40px);opacity:0.32;}
.nx-orb1{width:200px;height:200px;top:10%;left:-50px;background:radial-gradient(circle,#16a34a,transparent 70%);animation:nxOrb1 12s ease-in-out infinite;}
.nx-orb2{width:160px;height:160px;bottom:15%;right:-40px;background:radial-gradient(circle,#4ade80,transparent 70%);animation:nxOrb2 10s ease-in-out infinite;}
.nx-orb3{width:120px;height:120px;top:50%;right:20%;background:radial-gradient(circle,#22c55e,transparent 70%);animation:nxOrb3 14s ease-in-out infinite;}
@keyframes nxOrb1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(40px,30px) scale(1.15);}}
@keyframes nxOrb2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-30px,-40px) scale(1.2);}}
@keyframes nxOrb3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-20px,25px) scale(0.85);}}
#nxParticles{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* LOGIN */
#login-screen{position:relative;z-index:2;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;}
.nx-wrap{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;}
.nx-card{position:relative;width:100%;border:1px solid var(--bd);border-radius:22px;background:radial-gradient(circle at 15% 0%,rgba(34,197,94,0.14),transparent 45%),linear-gradient(155deg,rgba(6,30,20,0.94),rgba(2,20,14,0.96));box-shadow:0 25px 70px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.03),inset 0 1px 0 rgba(255,255,255,0.06);overflow:hidden;backdrop-filter:blur(18px);}
.nx-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#16a34a,#4ade80,#a7f3d0,#4ade80,#16a34a,transparent);background-size:200% 100%;animation:nxShimmer 2.8s linear infinite;z-index:5;}
@keyframes nxShimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}

.nx-head{display:flex;flex-direction:column;align-items:center;gap:6px;padding:24px 20px 12px;text-align:center;}
.nx-logo-wrap{position:relative;width:58px;height:58px;margin-bottom:2px;}
.nx-logo-ring{position:absolute;inset:-4px;border:2px solid transparent;border-radius:50%;border-top-color:rgba(34,197,94,0.55);border-right-color:rgba(74,222,128,0.35);animation:nxRingSpin 3s linear infinite;}
@keyframes nxRingSpin{to{transform:rotate(360deg);}}
.nx-logo-ring2{position:absolute;inset:-8px;border:1px solid transparent;border-radius:50%;border-bottom-color:rgba(22,163,74,0.28);border-left-color:rgba(34,197,94,0.12);animation:nxRingSpin 4s linear infinite reverse;}
.nx-logo{position:relative;width:58px;height:58px;display:grid;place-items:center;border:1px solid rgba(34,197,94,0.28);border-radius:16px;background:linear-gradient(145deg,rgba(22,163,74,0.2),rgba(34,197,94,0.08));color:#4ade80;font-size:24px;box-shadow:0 8px 28px rgba(22,163,74,0.2),inset 0 1px 0 rgba(255,255,255,0.08);animation:nxPulse 2.5s ease-in-out infinite alternate;}
@keyframes nxPulse{0%{box-shadow:0 8px 28px rgba(22,163,74,0.2),inset 0 1px 0 rgba(255,255,255,0.08);}100%{box-shadow:0 8px 40px rgba(22,163,74,0.35),0 0 24px rgba(34,197,94,0.15),inset 0 1px 0 rgba(255,255,255,0.12);}}
.nx-head h1{margin:0;font-family:'Orbitron',monospace;font-size:19px;font-weight:800;background:linear-gradient(135deg,#ecfdf5,#4ade80 45%,#22c55e 75%,#16a34a);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px;}
.nx-head p{margin:0;color:var(--mut);font-size:11px;font-weight:500;}

.nx-tabs{display:flex;gap:4px;padding:0 18px;}
.nx-tab{flex:1;padding:9px 0;border:none;border-radius:12px;background:transparent;color:var(--mut);font-size:12px;font-weight:700;cursor:pointer;transition:all 0.3s;font-family:'Poppins',sans-serif;position:relative;}
.nx-tab.active{background:linear-gradient(135deg,rgba(22,163,74,0.22),rgba(34,197,94,0.12));color:#4ade80;box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);}
.nx-tab.active::after{content:'';position:absolute;bottom:0;left:22%;right:22%;height:2px;background:linear-gradient(90deg,transparent,#4ade80,transparent);}
.nx-tab i{margin-right:4px;}

.nx-body{padding:12px 18px 18px;}
.nx-form{display:none;flex-direction:column;gap:11px;}
.nx-form.active{display:flex;animation:nxFadeIn 0.35s ease;}
@keyframes nxFadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.nx-field{display:grid;gap:4px;}
.nx-field label{color:#6ee7b7;font-size:10px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;padding-left:2px;}
.nx-input-wrap{position:relative;display:flex;align-items:center;}
.nx-input-wrap>i{position:absolute;left:12px;color:#3d7a55;font-size:13px;pointer-events:none;z-index:1;}
.nx-input{width:100%;padding:11px 12px 11px 36px;border:1px solid rgba(34,197,94,0.16);border-radius:12px;background:var(--ibg);color:var(--txt);font-size:13px;font-weight:500;outline:none;font-family:'Poppins',sans-serif;transition:all 0.3s;}
.nx-input::placeholder{color:#3d6b50;}
.nx-input:focus{border-color:rgba(34,197,94,0.45);background:rgba(34,197,94,0.1);box-shadow:0 0 0 3px rgba(22,163,74,0.12);}
.nx-eye{position:absolute;right:11px;color:#3d7a55;font-size:13px;cursor:pointer;background:none;border:none;padding:0;z-index:1;}

.nx-btn{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Poppins',sans-serif;box-shadow:0 6px 22px rgba(22,163,74,0.3);display:flex;align-items:center;justify-content:center;gap:8px;}
.nx-btn:disabled{opacity:0.6;cursor:not-allowed;}
.nx-btn .fa-spin{animation:nxSpin 1s linear infinite;}
@keyframes nxSpin{to{transform:rotate(360deg);}}

.nx-msg{display:none;padding:8px 11px;border-radius:10px;font-size:11px;font-weight:600;text-align:center;}
.nx-msg.show{display:block;animation:nxFadeIn 0.25s ease;}
.nx-msg.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:#fca5a5;}
.nx-msg.success{background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.3);color:#86efac;}

.nx-foot{display:flex;align-items:center;justify-content:center;gap:5px;padding:11px 18px 14px;border-top:1px solid rgba(34,197,94,0.1);color:#3d6b50;font-size:9px;font-weight:600;}
.nx-foot i{color:#22c55e;}

/* Success / Loading video after login */
.nx-success{display:none;position:fixed;inset:0;z-index:200;background:#000;align-items:center;justify-content:center;flex-direction:column;}
.nx-success.show{display:flex;animation:nxFadeIn 0.35s ease;}
.nx-success-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;}
.nx-success-skip{
  position:absolute;top:18px;right:18px;z-index:210;
  background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.4);
  color:#fff;padding:9px 18px;border-radius:22px;font-size:0.82rem;font-weight:600;
  cursor:pointer;font-family:'Poppins',sans-serif;backdrop-filter:blur(8px);
  box-shadow:0 4px 14px rgba(0,0,0,0.4);
}
.nx-success-skip:hover{background:rgba(34,197,94,0.5);border-color:#4ade80;}
.nx-success-hint{position:absolute;bottom:28px;left:0;right:0;text-align:center;color:rgba(255,255,255,0.75);font-size:0.8rem;z-index:205;text-shadow:0 1px 8px #000;pointer-events:none;}

/* DASHBOARD */
#dashboard{display:none;position:relative;z-index:2;min-height:100dvh;padding-bottom:40px;}

/* Banner */
.banner-wrap{position:relative;width:100%;height:160px;overflow:hidden;}
.banner-wrap img,.banner-wrap video{width:100%;height:100%;object-fit:cover;object-position:center;display:block;}
.banner-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,26,18,0.15) 0%,rgba(2,26,18,0.75) 70%,#021a12 100%);}
.banner-title{position:absolute;bottom:14px;left:16px;right:16px;z-index:2;}
.banner-title h1{font-family:'Orbitron',monospace;font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,#ecfdf5,#4ade80 50%,#22c55e);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 20px rgba(0,0,0,0.4);}
.banner-title span{font-size:0.72rem;color:#86efac;font-weight:500;opacity:0.9;}

.status-bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 14px 0;background:rgba(6,30,20,0.75);border:1px solid var(--bd);border-radius:14px;padding:11px 13px;align-items:center;backdrop-filter:blur(10px);}
.status-item{display:flex;align-items:center;gap:5px;font-size:0.75rem;color:#a7f3d0;}
.status-item .dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;}
.role-badge{background:rgba(22,163,74,0.25);color:#d1fae5;padding:3px 10px;border-radius:20px;font-size:0.72rem;border:1px solid rgba(34,197,94,0.35);}
.logout-btn{margin-left:auto;background:rgba(239,68,68,0.12);color:#fca5a5;border:1px solid rgba(239,68,68,0.28);padding:5px 12px;border-radius:20px;font-size:0.72rem;font-weight:600;cursor:pointer;font-family:'Poppins',sans-serif;}

.tabs{display:flex;gap:7px;padding:14px 14px 6px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:7px 14px;border-radius:20px;background:rgba(6,30,20,0.7);border:1px solid var(--bd);color:#a7f3d0;font-size:0.8rem;white-space:nowrap;cursor:pointer;transition:all 0.2s;font-family:'Poppins',sans-serif;}
.tab.active{background:linear-gradient(90deg,#16a34a,#22c55e);border-color:transparent;color:white;font-weight:600;}

.section-title{padding:10px 16px 6px;font-size:0.9rem;color:#a7f3d0;font-weight:600;}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;padding:0 14px 30px;}
.tool-card{background:linear-gradient(160deg,rgba(6,30,20,0.92),rgba(3,20,14,0.96));border:1px solid var(--bd);border-radius:16px;padding:16px 13px;cursor:pointer;transition:all 0.22s;}
.tool-card:hover,.tool-card:active{border-color:#4ade80;transform:translateY(-3px);box-shadow:0 10px 28px rgba(22,163,74,0.25);}
.tool-card .icon{font-size:1.55rem;margin-bottom:8px;display:block;color:#4ade80;}
.tool-card h3{font-size:0.85rem;font-weight:600;color:#d1fae5;margin-bottom:3px;}
.tool-card p{font-size:0.68rem;color:#6ee7b7;line-height:1.3;opacity:0.8;}
.tool-card .tag{display:inline-block;margin-top:9px;padding:2px 7px;background:rgba(22,163,74,0.28);color:#a7f3d0;font-size:0.62rem;border-radius:6px;border:1px solid rgba(34,197,94,0.35);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.78);display:none;align-items:center;justify-content:center;z-index:100;padding:14px;backdrop-filter:blur(6px);}
.modal-overlay.show{display:flex;}
.modal{background:linear-gradient(160deg,#0a2e1c,#041a12);border:1px solid rgba(34,197,94,0.35);border-radius:18px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;padding:22px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,0.5);}
.modal h2{font-size:1.1rem;color:#d1fae5;margin-bottom:14px;padding-right:36px;font-family:'Orbitron',monospace;font-weight:700;}
.modal .close-btn{
  position:absolute;top:14px;right:14px;
  background:linear-gradient(145deg,rgba(34,197,94,0.28),rgba(6,30,20,0.95));
  border:1px solid rgba(74,222,128,0.4);
  color:#d1fae5;
  width:34px;height:34px;border-radius:10px;
  font-size:1rem;line-height:1;cursor:pointer;z-index:5;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.08);
  transition:transform 0.15s ease, background 0.15s ease;
}
.modal .close-btn:hover,.modal .close-btn:active{
  background:linear-gradient(145deg,rgba(34,197,94,0.5),rgba(22,163,74,0.4));
  border-color:#4ade80;
  transform:scale(1.06);
}
.modal input,.modal textarea,.modal select{width:100%;padding:11px 13px;background:rgba(34,197,94,0.06);border:1px solid rgba(34,197,94,0.2);border-radius:10px;color:var(--txt);font-size:0.9rem;margin-bottom:11px;outline:none;font-family:'Poppins',sans-serif;}
.modal input:focus,.modal textarea:focus{border-color:#4ade80;}
.modal button.action{width:100%;padding:12px;background:linear-gradient(90deg,#16a34a,#22c55e);border:none;border-radius:10px;color:white;font-weight:600;cursor:pointer;font-family:'Poppins',sans-serif;font-size:0.9rem;margin-top:4px;}
.modal .result{margin-top:14px;padding:13px;background:rgba(4,20,14,0.85);border-radius:10px;border:1px solid rgba(34,197,94,0.2);font-size:0.82rem;line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto;color:#bbf7d0;}
.modal .result.success{border-color:rgba(34,197,94,0.5);}
.modal .result.error{border-color:rgba(239,68,68,0.45);}
.modal .result a{color:#4ade80;text-decoration:underline;}

.drop-zone{border:2px dashed rgba(34,197,94,0.35);border-radius:14px;padding:28px 16px;text-align:center;color:#6ee7b7;font-size:0.85rem;margin-bottom:12px;transition:all 0.2s;cursor:pointer;background:rgba(34,197,94,0.04);}
.drop-zone.dragover{border-color:#4ade80;background:rgba(34,197,94,0.12);color:#4ade80;}
.drop-zone i{font-size:1.8rem;display:block;margin-bottom:8px;color:#4ade80;}

.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px;}
.calc-grid button{padding:13px;font-size:1.05rem;border:none;border-radius:10px;background:rgba(20,60,40,0.5);color:#d1fae5;cursor:pointer;font-family:'Poppins',sans-serif;}
.calc-grid button.op{background:rgba(22,163,74,0.4);}
.calc-grid button.eq{background:linear-gradient(90deg,#16a34a,#22c55e);grid-column:span 2;}
#calc-display{width:100%;padding:14px;font-size:1.5rem;text-align:right;background:rgba(4,20,14,0.8);border:1px solid rgba(34,197,94,0.2);border-radius:10px;color:#d1fae5;margin-bottom:8px;font-family:'Orbitron',monospace;}

#qrcode{display:flex;justify-content:center;margin:14px 0;padding:10px;background:white;border-radius:10px;}

.legal-note{text-align:center;padding:16px;font-size:0.72rem;color:#3d6b50;}
@media(max-width:480px){.tools-grid{grid-template-columns:repeat(2,1fr);}.banner-wrap{height:140px;}}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:rgba(34,197,94,0.3);border-radius:4px;}
</style>
</head>
<body>
<div class="nx-bg"></div>
<div class="nx-orb nx-orb1"></div>
<div class="nx-orb nx-orb2"></div>
<div class="nx-orb nx-orb3"></div>
<canvas id="nxParticles"></canvas>

<!-- LOGIN -->
<div id="login-screen">
  <div class="nx-wrap">
    <div class="nx-card">
      <div class="nx-head">
        <div class="nx-logo-wrap">
          <div class="nx-logo-ring"></div>
          <div class="nx-logo-ring2"></div>
          <div class="nx-logo"><i class="fas fa-leaf"></i></div>
        </div>
        <h1 id="nxTitle">TOOLS BUDIZS</h1>
        <p id="nxSub">Masuk untuk mengakses semua tools</p>
      </div>
      <div class="nx-tabs">
        <button class="nx-tab active" id="nxTabLogin" onclick="nxTab('login')"><i class="fas fa-right-to-bracket"></i> Masuk</button>
        <button class="nx-tab" id="nxTabReg" onclick="nxTab('register')"><i class="fas fa-user-plus"></i> Daftar</button>
      </div>
      <div class="nx-body">
        <form class="nx-form active" id="nxLoginForm" onsubmit="return nxDoLogin(event)">
          <div class="nx-field">
            <label>Username</label>
            <div class="nx-input-wrap">
              <input type="text" class="nx-input" id="logUser" placeholder="Masukkan username" autocomplete="username" required>
              <i class="fas fa-user"></i>
            </div>
          </div>
          <div class="nx-field">
            <label>Password</label>
            <div class="nx-input-wrap">
              <input type="password" class="nx-input" id="logPass" placeholder="Masukkan password" autocomplete="current-password" required>
              <i class="fas fa-lock"></i>
              <button type="button" class="nx-eye" onclick="nxEye('logPass',this)"><i class="fas fa-eye"></i></button>
            </div>
          </div>
          <div class="nx-msg" id="logMsg"></div>
          <button type="submit" class="nx-btn" id="logBtn"><i class="fas fa-arrow-right"></i> Masuk</button>
        </form>
        <form class="nx-form" id="nxRegForm" onsubmit="return nxDoRegister(event)">
          <div class="nx-field">
            <label>Username</label>
            <div class="nx-input-wrap">
              <input type="text" class="nx-input" id="regUser" placeholder="Buat username baru" autocomplete="username" required minlength="3">
              <i class="fas fa-user"></i>
            </div>
          </div>
          <div class="nx-field">
            <label>Password</label>
            <div class="nx-input-wrap">
              <input type="password" class="nx-input" id="regPass" placeholder="Buat password" autocomplete="new-password" required minlength="4">
              <i class="fas fa-lock"></i>
              <button type="button" class="nx-eye" onclick="nxEye('regPass',this)"><i class="fas fa-eye"></i></button>
            </div>
          </div>
          <div class="nx-field">
            <label>Ulangi Password</label>
            <div class="nx-input-wrap">
              <input type="password" class="nx-input" id="regPass2" placeholder="Ulangi password" autocomplete="new-password" required minlength="4">
              <i class="fas fa-lock"></i>
              <button type="button" class="nx-eye" onclick="nxEye('regPass2',this)"><i class="fas fa-eye"></i></button>
            </div>
          </div>
          <div class="nx-msg" id="regMsg"></div>
          <button type="submit" class="nx-btn" id="regBtn"><i class="fas fa-check"></i> Daftar</button>
        </form>
      </div>
      <div class="nx-foot"><i class="fas fa-leaf"></i> TOOLS BUDIZS · Legal Tools Only</div>
    </div>
  </div>
</div>

<div class="nx-success" id="nxSuccess">
  <video class="nx-success-video" id="nxSuccessVideo" muted playsinline webkit-playsinline preload="auto"></video>
  <button type="button" class="nx-success-skip" id="nxSuccessSkip" onclick="skipLoginLoading()">Skip</button>
  <div class="nx-success-hint">Memuat dashboard...</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <!-- Banner Image -->
  <div class="banner-wrap">
    <video class="banner-video" autoplay muted loop playsinline preload="metadata" aria-label="Banner video">
      <source src="https://adorable-jade-rcajhjwq.edgeone.dev/" type="video/mp4">
    </video>
    <div class="banner-overlay"></div>
    <div class="banner-title">
      <h1>TOOLS BUDIZS</h1>
      <span>Legal Tools Collection</span>
    </div>

/* Particles */
(function(){
  var c=document.getElementById('nxParticles'),ctx=c.getContext('2d'),w,h,parts=[];
  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;}
  function init(){parts=[];var n=Math.min(35,Math.floor(w/14));for(var i=0;i<n;i++){parts.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*2+0.5,o:Math.random()*0.5+0.1});}}
  function draw(){ctx.clearRect(0,0,w,h);for(var i=0;i<parts.length;i++){var p=parts[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fillStyle='rgba(34,197,94,'+p.o+')';ctx.fill();}
  for(var i=0;i<parts.length;i++){for(var j=i+1;j<parts.length;j++){var dx=parts[i].x-parts[j].x,dy=parts[i].y-parts[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<90){ctx.beginPath();ctx.moveTo(parts[i].x,parts[i].y);ctx.lineTo(parts[j].x,parts[j].y);ctx.strokeStyle='rgba(34,197,94,'+(0.07*(1-d/90))+')';ctx.lineWidth=0.5;ctx.stroke();}}}
  requestAnimationFrame(draw);}
  resize();init();draw();
  window.addEventListener('resize',function(){resize();init();});
})();

function finishLoginLoading(){
  if(_loginTimer){ clearTimeout(_loginTimer); _loginTimer = null; }
  var s = document.getElementById("nxSuccess");
  var v = document.getElementById("nxSuccessVideo");
  if(v){
    try{ v.onended = null; v.onerror = null; v.pause(); v.removeAttribute('src'); v.load(); }catch(e){}
  }
  if(s) s.classList.remove("show");
  var cb = _loginCb;
  _loginCb = null;
  if(cb) cb();
}

function skipLoginLoading(){
  finishLoginLoading();
}

function showSuccess(title,text,cb){
  _loginCb = cb || null;
  try{ document.getElementById("login-screen").style.display = "none"; }catch(e){}
  var s = document.getElementById("nxSuccess");
  var v = document.getElementById("nxSuccessVideo");
  s.classList.add("show");

  if(v){
    try{
      v.muted = true;
      v.setAttribute('muted','');
      v.playsInline = true;
      v.setAttribute('playsinline','');
      v.setAttribute('webkit-playsinline','');
      v.onended = function(){ finishLoginLoading(); };
      v.onerror = function(){ setTimeout(finishLoginLoading, 400); };

      // set src langsung biar pasti load
      if(v.src !== LOGIN_VIDEO_URL){
        v.src = LOGIN_VIDEO_URL;
      }
      v.load();

      var tryPlay = function(){
        var p = v.play();
        if(p && typeof p.then === 'function'){
          p.then(function(){}).catch(function(){
            // retry sekali
            v.muted = true;
            v.play().catch(function(){});
          });
        }
      };

      if(v.readyState >= 2) tryPlay();
      else {
        v.onloadeddata = tryPlay;
        v.oncanplay = tryPlay;
        setTimeout(tryPlay, 300);
      }
    }catch(e){
      setTimeout(finishLoginLoading, 500);
    }
  }

  if(_loginTimer) clearTimeout(_loginTimer);
  _loginTimer = setTimeout(function(){ finishLoginLoading(); }, 15000);
}

async function runBGRemove(file){
  if(!file) return;
  var res = document.getElementById('bg-result');
  var status = document.getElementById('bg-status');
  res.style.display = 'block';
  res.className = 'result';
  res.innerHTML = 'Memproses...';

  if(!file.type.startsWith('image/')){
    res.className = 'result error';
    res.textContent = 'Hanya file gambar yang didukung';
    return;
  }

  if(file.size > 12 * 1024 * 1024){
    res.className = 'result error';
    res.textContent = 'File terlalu besar. Maksimal ~12MB untuk free tier.';
    return;
  }

  try{
    if(status){
      status.style.display = 'block';
      status.textContent = 'Mengirim ke remove.bg...';
    }
    res.innerHTML = 'Sedang diproses...';

    var form = new FormData();
    form.append('image_file', file);
    form.append('size', 'auto');

    var response = await fetch('https://api.remove.bg/v1.0/removebg', {
      method: 'POST',
      headers: {
        'X-Api-Key': REMOVE_BG_API_KEY
      },
      body: form
    });

    if(!response.ok){
      var errText = await response.text();
      var errMsg = 'Error ' + response.status;
      try{
        var errJson = JSON.parse(errText);
        if(errJson.errors && errJson.errors[0]) errMsg = errJson.errors[0].title || errJson.errors[0].code || errMsg;
      }catch(e){}
      throw new Error(errMsg);
    }

    var blob = await response.blob();
    var url = URL.createObjectURL(blob);

    if(status) status.style.display = 'none';
    res.className = 'result success';
    res.innerHTML = '<b>Berhasil!</b><br><br>' +
      '<img src="' + url + '" style="max-width:100%;border-radius:10px;background:repeating-conic-gradient(#ccc 0% 25%,#fff 0% 50%) 50%/16px 16px;border:1px solid rgba(34,197,94,0.3)"><br><br>' +

    res.className = 'result error';

      '<br><br>Coba foto lain, atau cek kuota API key remove.bg.';
  }
}

function setupDropZone(zoneId, inputId, handler){
  var zone=document.getElementById(zoneId);
  if(!zone) return;
  zone.addEventListener('dragover',function(e){e.preventDefault();zone.classList.add('dragover');});
  zone.addEventListener('dragleave',function(){zone.classList.remove('dragover');});

async function tryUploadProviders(file, statusEl){
  // 1. catbox.moe (lebih permanen, support apk/html/dll)
  try{
    statusEl.textContent = 'Mencoba server 1/4 (catbox)...';
    var form0 = new FormData();
    form0.append('reqtype', 'fileupload');
    form0.append('fileToUpload', file);
    var r0 = await fetch('https://catbox.moe/user/api.php', {method:'POST', body:form0});
    var link0 = (await r0.text()).trim();
    if(link0 && link0.startsWith('http')){
      return {ok:true, link:link0, provider:'catbox.moe (lebih permanen)'};
    }
  }catch(e){}

  // 2. tmpfiles.org
  try{
    statusEl.textContent = 'Mencoba server 2/4 (tmpfiles)...';
    var form1 = new FormData();
    form1.append('file', file);
    var r1 = await fetch('https://tmpfiles.org/api/v1/upload', {method:'POST', body:form1});
    var d1 = await r1.json();
    if(d1.status === 'success' && d1.data && d1.data.url){
      return {ok:true, link:d1.data.url.replace('tmpfiles.org/','tmpfiles.org/dl/'), provider:'tmpfiles.org'};
    }
  }catch(e){}

  // 3. litterbox (24 jam)
  try{
    statusEl.textContent = 'Mencoba server 3/4 (litterbox)...';
    var form2 = new FormData();
    form2.append('reqtype', 'fileupload');
    form2.append('time', '24h');
    form2.append('fileToUpload', file);
    var r2 = await fetch('https://litterbox.catbox.moe/resources/internals/api.php', {method:'POST', body:form2});
    var link2 = (await r2.text()).trim();
    if(link2 && link2.startsWith('http')){
      return {ok:true, link:link2, provider:'litterbox (24 jam)'};
    }
  }catch(e){}

  // 4. file.io
  try{
    statusEl.textContent = 'Mencoba server 4/4 (file.io)...';
    var form3 = new FormData();
    form3.append('file', file);
    var r3 = await fetch('https://file.io', {method:'POST', body:form3});

    if(d3.success && d3.link){
      return {ok:true, link:d3.link, provider:'file.io'};
    }
  }catch(e){}

  return {ok:false};
}

  /imagen/i, /gemini/i, /chatgpt/i, /openai/i, /leonardo\.?ai/i, /ideogram/i,

  /generated\s*by\s*ai/i, /ai\s*generated/i, /trainedalgorithmicmedia/i,

function loadExifr(){

    s.src = 'https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js';
    s.onload = function(){ resolve(window.exifr); };
    s.onerror = function(){ reject(new Error('Gagal load library EXIF')); };
    document.head.appendChild(s);

}

async function runAIPhotoCheck(file){
  if(!file) return;
  var res = document.getElementById('ai-result');
  var status = document.getElementById('ai-status');
  res.style.display = 'block';
  res.className = 'result';
  res.innerHTML = 'Memproses...';

  if(!file.type.startsWith('image/')){
    res.className = 'result error';
    res.textContent = 'Hanya file gambar yang didukung (JPG, PNG, WEBP, dll)';
    return;
  }
  if(file.size > 25 * 1024 * 1024){
    res.className = 'result error';
    res.textContent = 'File terlalu besar. Maksimal ~25MB.';
    return;
  }

  try{
    if(status){
      status.style.display = 'block';
      status.textContent = 'Membaca metadata EXIF/XMP...';
    }

    var exifrLib = await loadExifr();
    var meta = {};
    try{
      meta = await exifrLib.parse(file, {
        tiff: true, xmp: true, icc: false, iptc: true, jfif: true, ihdr: true,
        multiSegment: true, mergeOutput: true, translateKeys: false, reviveValues: true
      }) || {};
    }catch(e){
      meta = {};
    }

    // Kumpulkan semua string metadata untuk scan
    var allText = '';
    var flat = {};
    function flatten(obj, prefix){
      if(!obj || typeof obj !== 'object') return;
      Object.keys(obj).forEach(function(k){
        var v = obj[k];
        var key = prefix ? prefix + '.' + k : k;
        if(v && typeof v === 'object' && !(v instanceof Date) && !(v instanceof Array)){
          flatten(v, key);
        } else {
          var s = String(v);
          flat[key] = s;
          allText += ' ' + s;
        }
      });
    }
    flatten(meta);

    // Cek signature AI
    var aiHits = [];
    AI_SOFTWARE_PATTERNS.forEach(function(re){
      if(re.test(allText)){
        var m = allText.match(re);
        if(m) aiHits.push(m[0]);
      }
    });
    // Uniq
    aiHits = aiHits.filter(function(v,i,a){ return a.indexOf(v)===i; });

    // Cek field penting
    var software = flat.Software || flat.software || flat['xmp.CreatorTool'] || flat.CreatorTool || flat['XMP:CreatorTool'] || '';
    var make = flat.Make || flat.make || '';
    var model = flat.Model || flat.model || '';
    var artist = flat.Artist || flat.artist || flat.Author || '';
    var digitalSource = flat.DigitalSourceType || flat.digitalSourceType || flat['Iptc4xmpExt:DigitalSourceType'] || '';
    var hasCamera = !!(make || model);
    var hasSoftware = !!software;
    var hasGPS = !!(flat.latitude || flat.GPSLatitude || flat.GPSLatitudeRef);
    var hasDate = !!(flat.DateTimeOriginal || flat.CreateDate || flat.ModifyDate);

    // Scoring
    var score = 0; // 0 = real, 100 = AI
    var reasons = [];
    var metaCount = Object.keys(flat).length;

    if(aiHits.length > 0){
      score += 75;
      reasons.push('Ditemukan signature AI: ' + aiHits.slice(0,4).join(', '));
    }
    if(/trainedAlgorithmicMedia|compositeWithTrainedAlgorithmicMedia/i.test(digitalSource) || /trainedAlgorithmicMedia/i.test(allText)){
      score += 45;
      reasons.push('DigitalSourceType menandakan media algoritmik (C2PA/AI)');
    }
    if(software && AI_SOFTWARE_PATTERNS.some(function(re){ return re.test(software); })){
      score += 30;
      reasons.push('Software/CreatorTool: ' + software.substring(0,60));
    }

    // Metadata minim = indikasi kuat AI (banyak generator strip EXIF)
    if(!hasCamera && !hasSoftware && metaCount < 8){
      score += 40;
      reasons.push('Metadata sangat minim / kosong (ciri khas banyak output AI)');
    } else if(!hasCamera && metaCount < 15){
      score += 25;
      reasons.push('Tidak ada data kamera (Make/Model) + metadata terbatas');
    } else if(!hasCamera){
      score += 15;
      reasons.push('Tidak ada data kamera (Make/Model)');
    }

    if(hasCamera){
      score -= 30;
      reasons.push('Ada data kamera: ' + (make + ' ' + model).trim());
    }
    if(hasGPS){
      score -= 12;
      reasons.push('Ada data GPS (lebih sering di foto asli)');
    }
    if(hasDate && hasCamera){
      score -= 8;
    }

    // Clamp
    score = Math.max(0, Math.min(100, score));

    var isAI = score >= 50;
    var isLikelyReal = score <= 25;
    var badgeColor = isAI ? '#f87171' : (isLikelyReal ? '#4ade80' : '#fbbf24');
    var badgeText = isAI ? 'BUATAN AI' : (isLikelyReal ? 'KEMUNGKINAN ASLI' : 'TIDAK PASTI');

    if(status) status.style.display = 'none';

    var html = '<div style="text-align:center;margin-bottom:12px">' +
      '<span style="display:inline-block;padding:8px 18px;border-radius:20px;font-weight:700;font-size:0.95rem;background:rgba(0,0,0,0.3);border:2px solid '+badgeColor+';color:'+badgeColor+'">' + badgeText + '</span>' +
      '<div style="margin-top:8px;font-size:1.05rem;color:#a7f3d0">Skor AI: <b>' + score + '%</b></div>' +
      '</div>';

    if(reasons.length){
      html += '<b>Temuan:</b><br>';
      reasons.forEach(function(r){ html += '• ' + esc(r) + '<br>'; });
    }

    // Tampilkan field penting saja (filter key angka & internal)
    var important = ['Make','Model','Software','CreatorTool','DateTimeOriginal','CreateDate','ModifyDate','Artist','Author','ImageWidth','ImageHeight','Orientation','ExposureTime','FNumber','ISO','FocalLength','LensModel','DigitalSourceType'];
    var shown = 0;
    var metaHtml = '';
    important.forEach(function(k){
      if(flat[k] && shown < 10){
        metaHtml += '• <b>' + esc(k) + ':</b> ' + esc(String(flat[k]).substring(0,70)) + '<br>';
        shown++;
      }
    });
    // Tambah key lain yang meaningful (bukan angka / internal PNG)
    Object.keys(flat).forEach(function(k){
      if(shown >= 12) return;
      if(important.indexOf(k) !== -1) return;
      if(/^\d+$/.test(k) || k.length < 2) return; // skip numeric keys
      var val = String(flat[k]);
      if(val.length > 2 && val.length < 90 && !/^(Deflate|Inflate|Adaptive|RGB|sRGB)$/i.test(val)){
        metaHtml += '• <b>' + esc(k) + ':</b> ' + esc(val) + '<br>';
        shown++;
      }
    });

    if(metaHtml){
      html += '<br><b>Metadata yang terbaca:</b><br>' + metaHtml;
    } else {
      html += '<br><i style="color:#6ee7b7">Tidak ada metadata EXIF berarti (hanya info file dasar).</i>';
    }

    html += '<br><div style="font-size:0.75rem;color:#6ee7b7;margin-top:10px;line-height:1.4">' +
      '⚠️ Deteksi ini berbasis metadata. Foto AI yang sudah di-strip / di-screenshot / di-re-save sering lolos. Untuk deteksi visual yang lebih akurat coba <a href="https://isitai.com/ai-image-detector" target="_blank" style="color:#4ade80">isitai.com</a> atau <a href="https://media.sens.center" target="_blank" style="color:#4ade80">MediaSens</a>.</div>';

    var previewUrl = URL.createObjectURL(file);
    html += '<br><img src="' + previewUrl + '" style="max-width:100%;border-radius:10px;margin-top:10px;border:1px solid rgba(34,197,94,0.3)">';

    res.className = isAI ? 'result error' : 'result success';
    res.innerHTML = html;

  }catch(err){
    console.error(err);
    if(status) status.style.display = 'none';
    res.className = 'result error';
    res.innerHTML = '<b>Gagal memindai.</b><br><br>' + esc(String(err.message || err)) +
      '<br><br>Coba foto format JPG/PNG lain.<br>' +
      'Atau cek manual di <a href="https://isitai.com/ai-image-detector" target="_blank" style="color:#4ade80">isitai.com</a>';
  }
}

function genPassword(){
  var len = parseInt(document.getElementById('pw-len').value) || 16;
  var chars = '';
  if(document.getElementById('pw-upper').checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if(document.getElementById('pw-lower').checked) chars += 'abcdefghijklmnopqrstuvwxyz';
  if(document.getElementById('pw-num').checked) chars += '0123456789';
  if(document.getElementById('pw-sym').checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
  if(!chars){ alert('Pilih minimal 1 jenis karakter'); return; }
  var pw = '';
  var arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  for(var i=0;i<len;i++) pw += chars[arr[i] % chars.length];
  var res = document.getElementById('pw-result');
  res.style.display = 'block';
  res.className = 'result success';
  res.innerHTML = '<b>'+esc(pw)+'</b><br><br><button class="action" style="width:auto;padding:8px 16px;font-size:0.85rem" onclick="navigator.clipboard.writeText(\''+pw.replace(/'/g,"\\'")+'\');this.textContent=\'Disalin!\'">Salin</button>';

async function openHash(){
  openModal(`
    <button class="close-btn" onclick="closeModal()">×</button>

      <option value="MD5">MD5</option>
      <option value="SHA-1">SHA-1</option>
      <option value="SHA-256" selected>SHA-256</option>
    </select>

    <div class="result" id="hash-result" style="display:none;margin-top:12px;word-break:break-all"></div>
  `);
}
async function doHash(){
  var text = document.getElementById('hash-in').value;
  var type = document.getElementById('hash-type').value;
  var res = document.getElementById('hash-result');
  res.style.display = 'block';
  if(type === 'MD5'){
    // simple pure JS MD5
    res.innerHTML = '<b>MD5:</b><br>' + esc(md5(text));
    res.className = 'result success';
    return;
  }
  try{
    var enc = new TextEncoder().encode(text);
    var buf = await crypto.subtle.digest(type, enc);
    var hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    res.className = 'result success';
    res.innerHTML = '<b>'+type+':</b><br>' + hex;
  }catch(e){ res.className='result error'; res.textContent = e.message; }
}

function calcAge(){
  var d = document.getElementById('age-date').value;
  var res = document.getElementById('age-result');
  res.style.display = 'block';
  if(!d){ res.className='result error'; res.textContent='Pilih tanggal lahir'; return; }
  var birth = new Date(d), now = new Date();
  var y = now.getFullYear()-birth.getFullYear();
  var m = now.getMonth()-birth.getMonth();
  var day = now.getDate()-birth.getDate();
  if(day<0){ m--; day += new Date(now.getFullYear(),now.getMonth(),0).getDate(); }
  if(m<0){ y--; m+=12; }
  var totalDays = Math.floor((now-birth)/86400000);
  res.className = 'result success';
  res.innerHTML = '<b>'+y+' tahun, '+m+' bulan, '+day+' hari</b><br>Total: '+totalDays.toLocaleString()+' hari';
}

  updateUnitOpts();
}
var unitData = {
  length: {m:1, km:0.001, cm:100, mm:1000, mi:0.000621371, yd:1.09361, ft:3.28084, in:39.3701},
  mass: {kg:1, g:1000, mg:1e6, lb:2.20462, oz:35.274},
  temp: {}
};
function updateUnitOpts(){
  var type = document.getElementById('unit-type').value;
  var from = document.getElementById('unit-from');
  var to = document.getElementById('unit-to');
  from.innerHTML = ''; to.innerHTML = '';
  if(type==='temp'){
    ['Celsius','Fahrenheit','Kelvin'].forEach(function(u){
      from.innerHTML += '<option>'+u+'</option>';
      to.innerHTML += '<option>'+u+'</option>';
    });
  } else {
    Object.keys(unitData[type]).forEach(function(u){
      from.innerHTML += '<option value="'+u+'">'+u+'</option>';
      to.innerHTML += '<option value="'+u+'">'+u+'</option>';
    });
  }
}
function doUnit(){
  var type = document.getElementById('unit-type').value;
  var val = parseFloat(document.getElementById('unit-val').value);
  var from = document.getElementById('unit-from').value;
  var to = document.getElementById('unit-to').value;
  var res = document.getElementById('unit-result');
  res.style.display = 'block';
  if(isNaN(val)){ res.className='result error'; res.textContent='Isi angka'; return; }
  var result = 0;
  if(type==='temp'){
    var c = from==='Celsius'?val:from==='Fahrenheit'?(val-32)*5/9:val-273.15;
    result = to==='Celsius'?c:to==='Fahrenheit'?c*9/5+32:c+273.15;
  } else {
    result = val / unitData[type][from] * unitData[type][to];
  }
  res.className = 'result success';
  res.innerHTML = '<b>'+val+' '+from+' = '+result.toFixed(6)+' '+to+'</b>';
}

async function genIQC(){
  var text = document.getElementById('iqc-text').value.trim();
  var res = document.getElementById('iqc-result');
  var btn = document.getElementById('iqc-gen-btn');
  if(!text){ res.style.display='block'; res.className='result error'; res.textContent='Masukkan pesan!'; return; }

  res.style.display = 'block';
  res.className = 'result';
  res.innerHTML = 'Menghasilkan gambar...';
  btn.disabled = true;

  var url = '';
  if(iqcModel === 'A'){
    var chatTime = document.getElementById('iqc-chat-time').value || '08:08';
    var statusTime = document.getElementById('iqc-status-time').value || '08:08';
    var bubble = document.getElementById('iqc-bubble').value || '#272A2F';
    var textColor = document.getElementById('iqc-textcolor').value || '#FFFFFF';
    url = 'https://anabot.my.id/api/maker/iqc?text='+encodeURIComponent(text)+
      '&chatTime='+encodeURIComponent(chatTime)+
      '&statusBarTime='+encodeURIComponent(statusTime)+
      '&signalName='+encodeURIComponent(iqcCarrier)+
      '&bubbleColor='+encodeURIComponent(bubble)+
      '&menuColor='+encodeURIComponent(bubble)+
      '&textColor='+encodeURIComponent(textColor)+
      '&fontName=Arial&apikey=freeApikey';
  } else {
    var time = document.getElementById('iqc-b-time').value || '14:30';
    var bat = document.getElementById('iqc-b-bat').value || '92';
    var signal = document.getElementById('iqc-b-signal').value || '4';
    url = 'https://brat.siputzx.my.id/iphone-quoted?time='+encodeURIComponent(time)+
      '&messageText='+encodeURIComponent(text)+
      '&carrierName='+encodeURIComponent(iqcCarrier)+
      '&batteryPercentage='+bat+
      '&signalStrength='+signal+
      '&emojiStyle=apple';
  }

  try{
    // Coba load sebagai image dulu (banyak API return image langsung)
    var img = new Image();
    img.crossOrigin = 'anonymous';
    await new Promise(function(resolve, reject){
      img.onload = resolve;
      img.onerror = reject;
      img.src = url;
    });

    // Draw to canvas biar bisa download tanpa CORS issue
    var canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth || img.width;
    canvas.height = img.naturalHeight || img.height;
    canvas.getContext('2d').drawImage(img, 0, 0);
    if(iqcBlobUrl) URL.revokeObjectURL(iqcBlobUrl);
    iqcBlobUrl = canvas.toDataURL('image/png');

    res.className = 'result success';
    res.innerHTML = '<img src="'+iqcBlobUrl+'" style="max-width:100%;border-radius:10px"><br><br>'+
      '<a href="'+iqcBlobUrl+'" download="iqc_'+Date.now()+'.png" class="action" style="display:inline-block;text-decoration:none;padding:10px 18px">Download PNG</a>';
  }catch(e){
    // Fallback: tampilkan via <img> langsung (user bisa long-press save)
    res.className = 'result success';
    res.innerHTML = '<img src="'+url+'" style="max-width:100%;border-radius:10px" onerror="this.parentElement.innerHTML=\'<b>Gagal load gambar.</b><br>API mungkin down atau CORS.\'"><br><br>'+
      '<a href="'+url+'" target="_blank" class="action" style="display:inline-block;text-decoration:none;padding:10px 18px">Buka / Simpan Manual</a>';
  }
  btn.disabled = false;
}

function genWinQuotes(){
  var text = document.getElementById('wq-text').value.trim();
  var title = document.getElementById('wq-title').value.trim() || 'Windows';
  var res = document.getElementById('wq-result');
  if(!text){ res.style.display='block'; res.className='result error'; res.textContent='Isi teks dulu'; return; }

  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d');
  canvas.width = 480;
  canvas.height = 140;

  // Background
  ctx.fillStyle = '#1f1f1f';
  roundRect(ctx, 0, 0, 480, 140, 12);
  ctx.fill();

  // Accent bar
  ctx.fillStyle = '#0078d4';
  ctx.fillRect(0, 0, 6, 140);

  // Windows logo circle
  ctx.fillStyle = '#0078d4';
  ctx.beginPath();
  ctx.arc(40, 40, 18, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px Segoe UI, Arial';
  ctx.textAlign = 'center';
  ctx.fillText('W', 40, 45);

  // Title
  ctx.fillStyle = '#fff';
  ctx.font = '600 15px Segoe UI, Arial';
  ctx.textAlign = 'left';
  ctx.fillText(title, 70, 35);

  // Body text (wrap)
  ctx.fillStyle = '#d0d0d0';
  ctx.font = '400 14px Segoe UI, Arial';
  var lines = wrapText(ctx, text, 380);
  lines.slice(0, 4).forEach(function(line, i){
    ctx.fillText(line, 70, 60 + i*20);
  });

  // Time
  var now = new Date();
  var t = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  ctx.fillStyle = '#888';
  ctx.font = '12px Segoe UI, Arial';
  ctx.textAlign = 'right';
  ctx.fillText(t, 460, 130);

  var url = canvas.toDataURL('image/png');
  res.style.display = 'block';
  res.className = 'result success';
  res.innerHTML = '<img src="'+url+'" style="max-width:100%;border-radius:10px;border:1px solid #333"><br><br>'+
    '<a href="'+url+'" download="win_quotes_'+Date.now()+'.png" class="action" style="display:inline-block;text-decoration:none;padding:10px 18px">Download PNG</a>';
}
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

var ANA_APIKEY = 'freeApikey';
var ELY_BASE = 'https://elysian-api.vercel.app';

/* Helper: extract nested result from anabot response */
function anaExtract(data){
  if(!data) return null;
  if(data.success === false) return null;
  // { success, data: { result: ... } }
  if(data.data){
    if(data.data.result !== undefined) return data.data.result;
    if(data.data.data !== undefined) return data.data.data;
    return data.data;
  }
  if(data.result !== undefined) return data.result;
  return data;
}

async function searchDramaBox(){

  try{
    var r = await fetch('https://anabot.my.id/api/search/drama/dramabox/search?keyword='+encodeURIComponent(kw)+'&apikey='+encodeURIComponent(ANA_APIKEY));
    var data = await r.json();

      res.className='result error';
      res.innerHTML = '<b>API error.</b><br>'+esc((data.error && data.error.message) || JSON.stringify(data).substring(0,200));
      return;
    }
    var list = anaExtract(data);
    if(!list || (Array.isArray(list) && list.length===0)){
      res.className='result error';
      res.textContent = 'Tidak ditemukan.';
      return;
    }
    if(!Array.isArray(list)) list = [list];

      var id = item.bookId || item.id || item.dramaId || '';

      html += '<div style="margin-bottom:12px;padding:10px;background:rgba(0,0,0,0.25);border-radius:10px;border:1px solid rgba(34,197,94,0.2)">';

      html += '<b>'+esc(title)+'</b><br>';
      if(plays) html += '<span style="font-size:0.72rem;opacity:0.8">▶ '+esc(plays)+'</span><br>';
      if(tags) html += '<span style="font-size:0.72rem;opacity:0.75">'+esc(tags.substring(0,60))+'</span><br>';

    });

async function getDramaChapter(id){
  var res = document.getElementById('db-result');
  res.innerHTML = 'Mengambil chapter ID: '+esc(id)+'...';
  try{
    var r = await fetch('https://anabot.my.id/api/search/drama/dramabox/chapter?id='+encodeURIComponent(id)+'&apikey='+encodeURIComponent(ANA_APIKEY));
    var data = await r.json();
    var chapters = anaExtract(data);
    if(!chapters){ res.className='result error'; res.textContent='Gagal ambil chapter.'; return; }
    if(!Array.isArray(chapters)) chapters = [chapters];
    var html = '<button class="action" style="width:auto;padding:6px 12px;font-size:0.75rem;margin-bottom:10px" onclick="searchDramaBox()">← Kembali</button><br>';
    html += '<b>Chapter / Episode ('+chapters.length+'):</b><br><br>';
    chapters.slice(0,50).forEach(function(ch,i){
      var name = ch.chapterName || ch.title || ch.name || ('Episode '+(i+1));
      // Ambil video path terbaik
      var link = '';
      if(ch.cdnList && ch.cdnList.length){
        var cdn = ch.cdnList.find(function(c){return c.isDefault;}) || ch.cdnList[0];
        if(cdn && cdn.videoPathList && cdn.videoPathList.length){
          var vid = cdn.videoPathList.find(function(v){return v.isDefault;}) || cdn.videoPathList.find(function(v){return v.quality===720;}) || cdn.videoPathList[0];
          if(vid) link = vid.videoPath;
        }
      }
      if(!link) link = ch.url || ch.link || ch.playUrl || ch.videoUrl || '';
      html += '<div style="padding:6px 0;border-bottom:1px solid rgba(34,197,94,0.15)">';
      html += '<b>'+esc(name)+'</b>';
      if(link) html += ' — <a href="'+esc(link)+'" target="_blank" style="color:#4ade80">Play / Download</a>';
      html += '</div>';
    });
    if(chapters.length===0) html += '<i>Tidak ada chapter ditemukan.</i>';
    res.className='result success';
    res.innerHTML = html;
  }catch(e){
    res.className='result error';
    res.textContent = 'Gagal ambil chapter: '+e.message;
  }
}

async function doBStation(){
  var aid = document.getElementById('bs-aid').value.trim();
  var res = document.getElementById('bs-result');
  if(!aid){ res.style.display='block'; res.className='result error'; res.textContent='Masukkan AID'; return; }
  res.style.display='block'; res.className='result'; res.textContent='Mengambil data...';
  try{
    var r = await fetch('https://anabot.my.id/api/search/anime/bstation/detail?aid='+encodeURIComponent(aid)+'&apikey='+encodeURIComponent(ANA_APIKEY));
    var data = await r.json();
    var info = anaExtract(data);
    res.className='result success';
    var html = '<b>Detail BStation</b><br><br>';
    if(info && typeof info === 'object'){
      Object.keys(info).forEach(function(k){
        var v = info[k];
        if(v == null || v === '' || (Array.isArray(v) && v.length===0) || (typeof v==='object' && !Array.isArray(v) && Object.keys(v).length===0)) return;
        if(typeof v !== 'object') html += '<b>'+esc(k)+':</b> '+esc(String(v).substring(0,150))+'<br>';
        else if(Array.isArray(v) && typeof v[0] !== 'object') html += '<b>'+esc(k)+':</b> '+esc(v.slice(0,8).join(', '))+'<br>';
      });
      if(info.cover || info.thumbnail || info.image) html += '<br><img src="'+esc(info.cover||info.thumbnail||info.image)+'" style="max-width:100%;border-radius:8px;margin-top:8px" onerror="this.style.display=\'none\'">';
      var eps = info.episodes || info.eps || info.pages;
      if(Array.isArray(eps) && eps.length){
        html += '<br><b>Episode/Pages:</b><br>';
        eps.slice(0,25).forEach(function(ep,i){
          var t = typeof ep === 'object' ? (ep.title||ep.name||ep.page||'Ep '+(i+1)) : String(ep);
          var l = typeof ep === 'object' ? (ep.url||ep.link||'') : '';
          html += '• '+esc(String(t).substring(0,60))+(l?' <a href="'+esc(l)+'" target="_blank" style="color:#4ade80">link</a>':'')+'<br>';
        });
      }
      if(html.indexOf('<b>') === html.lastIndexOf('<b>')) {
        html += '<pre style="font-size:0.7rem;margin-top:8px;opacity:0.8">'+esc(JSON.stringify(info,null,2).substring(0,500))+'</pre>';
      }
    } else {
      html += '<pre style="font-size:0.75rem;white-space:pre-wrap">'+esc(JSON.stringify(data,null,2).substring(0,600))+'</pre>';
    }
    res.innerHTML = html;
  }catch(e){
    res.className='result error';
    res.textContent = 'Error: '+e.message;
  }
}

var gameState = { type: null, jawaban: '', soal: '', gambar: '', deskripsi: '' };

var GAME_META = {
  asahotak:  { title: 'Asah Otak',   endpoint: 'asahotak',  hint: 'Jawab soal asah otak di bawah.' },
  caklontong:{ title: 'Cak Lontong', endpoint: 'caklontong', hint: 'Tebakan lucu ala Cak Lontong.' },
  tebakjkt:  { title: 'Tebak JKT48', endpoint: 'tebakjkt',  hint: 'Tebak nama member dari fotonya.' },
  tebakkata: { title: 'Tebak Kata',  endpoint: 'tebakkata', hint: 'Tebak kata dari petunjuk yang diberikan.' }
};

function openGame(type){
  var meta = GAME_META[type];
  if(!meta) return;
  gameState = { type: type, jawaban: '', soal: '', gambar: '', deskripsi: '' };
  openModal(`
    <button class="close-btn" onclick="closeModal()">×</button>
    <h2>${meta.title}</h2>
    <p style="font-size:0.78rem;color:#6ee7b7;margin-bottom:12px">${meta.hint}</p>
    <button class="action" id="game-load-btn" onclick="loadGameQuestion()">Ambil Soal Baru</button>
    <div id="game-area" style="display:none;margin-top:14px">
      <div id="game-question" style="padding:14px;background:rgba(0,0,0,0.3);border-radius:12px;border:1px solid rgba(34,197,94,0.25);margin-bottom:12px;font-size:0.95rem;line-height:1.5"></div>
      <input type="text" id="game-answer" placeholder="Ketik jawabanmu..." onkeydown="if(event.key==='Enter')checkGameAnswer()">
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="action" style="flex:1" onclick="checkGameAnswer()">Cek Jawaban</button>
        <button class="action" style="flex:1;background:linear-gradient(90deg,#0ea5e9,#0284c7)" onclick="revealGameAnswer()">Lihat Jawaban</button>
      </div>
      <div class="result" id="game-result" style="display:none;margin-top:12px"></div>
    </div>
  `);
}

async function loadGameQuestion(){
  var type = gameState.type;
  var meta = GAME_META[type];
  if(!meta) return;
  var btn = document.getElementById('game-load-btn');
  var area = document.getElementById('game-area');
  var qEl = document.getElementById('game-question');
  var res = document.getElementById('game-result');
  var ansInput = document.getElementById('game-answer');
  if(btn){ btn.disabled = true; btn.textContent = 'Memuat...'; }
  if(res){ res.style.display = 'none'; res.innerHTML = ''; }
  if(ansInput) ansInput.value = '';
  try{
    var r = await fetch('https://anabot.my.id/api/games/fun/'+meta.endpoint+'?apikey='+encodeURIComponent(ANA_APIKEY));
    var data = await r.json();
    var info = anaExtract(data) || data.data || data;
    if(!info || (data.success === false)){
      if(qEl) qEl.innerHTML = '<span style="color:#fca5a5">Gagal ambil soal. Coba lagi.</span>';
      area.style.display = 'block';
      return;
    }
    gameState.jawaban = String(info.jawaban || info.answer || '').trim();
    gameState.soal = info.soal || info.question || info.petunjuk || '';
    gameState.gambar = info.gambar || info.image || info.foto || '';
    gameState.deskripsi = info.deskripsi || info.description || '';

    var html = '';
    if(gameState.gambar){
      html += '<div style="text-align:center;margin-bottom:10px"><img src="'+esc(gameState.gambar)+'" style="max-width:100%;max-height:220px;border-radius:10px;border:1px solid rgba(34,197,94,0.3)" onerror="this.parentElement.innerHTML=\'(gambar gagal load)\'"></div>';
      html += '<div style="text-align:center;font-size:0.85rem;opacity:0.85">Siapa member ini?</div>';
    }
    if(gameState.soal){
      html += '<div style="font-weight:600;margin-bottom:4px">Soal:</div>';
      html += '<div>'+esc(gameState.soal)+'</div>';
    }
    if(!html) html = '<i>Soal kosong, coba ambil lagi.</i>';
    qEl.innerHTML = html;
    area.style.display = 'block';
  }catch(e){
    if(qEl) qEl.innerHTML = '<span style="color:#fca5a5">Error: '+esc(e.message)+'</span>';
    area.style.display = 'block';
  }
  if(btn){ btn.disabled = false; btn.textContent = 'Ambil Soal Baru'; }
}

function normalizeAnswer(s){
  return String(s||'').toLowerCase().replace(/[^a-z0-9\s]/gi,'').replace(/\s+/g,' ').trim();
}

function checkGameAnswer(){
  var input = document.getElementById('game-answer');
  var res = document.getElementById('game-result');
  if(!gameState.jawaban){
    res.style.display='block'; res.className='result error';
    res.textContent = 'Ambil soal dulu.';
    return;
  }
  var user = normalizeAnswer(input ? input.value : '');
  var correct = normalizeAnswer(gameState.jawaban);
  res.style.display = 'block';
  if(!user){
    res.className = 'result error';
    res.textContent = 'Ketik jawaban dulu.';
    return;
  }
  // Accept if exact match or user answer contained in correct / vice versa (for multi-word)
  var ok = user === correct || correct.indexOf(user) !== -1 || user.indexOf(correct) !== -1;
  if(ok){
    res.className = 'result success';
    var html = '✅ <b>Benar!</b><br><b>Jawaban:</b> '+esc(gameState.jawaban);
    if(gameState.deskripsi) html += '<br><br><i>'+esc(gameState.deskripsi)+'</i>';
    res.innerHTML = html;
  } else {
    res.className = 'result error';
    res.innerHTML = '❌ <b>Salah.</b> Coba lagi atau klik "Lihat Jawaban".';
  }
}

function revealGameAnswer(){
  var res = document.getElementById('game-result');
  if(!gameState.jawaban){
    res.style.display='block'; res.className='result error';
    res.textContent = 'Ambil soal dulu.';
    return;
  }
  res.style.display = 'block';
  res.className = 'result success';
  var html = '💡 <b>Jawaban:</b> '+esc(gameState.jawaban);
  if(gameState.deskripsi) html += '<br><br><i>'+esc(gameState.deskripsi)+'</i>';
  res.innerHTML = html;
}

/* ========== MAKER HELPERS ========== */
async function fetchAsImage(url, resEl){
  resEl.style.display = 'block';
  resEl.className = 'result';
  resEl.textContent = 'Menghasilkan gambar...';
  try{
    var r = await fetch(url);
    var ct = (r.headers.get('content-type')||'').toLowerCase();
    if(ct.indexOf('image/') === 0){
      var blob = await r.blob();
      if(blob.size < 200){
        resEl.className='result error';
        resEl.textContent = 'Response gambar terlalu kecil / kosong.';
        return;
      }
      var imgUrl = URL.createObjectURL(blob);
      resEl.className = 'result success';
      resEl.innerHTML = '<img src="'+imgUrl+'" style="max-width:100%;border-radius:10px;border:1px solid rgba(34,197,94,0.3)"><br><br>'+
        '<a href="'+imgUrl+'" download="maker_'+Date.now()+'.png" class="action" style="display:inline-block;text-decoration:none;padding:10px 18px">Download PNG</a>';
      return;
    }
    // JSON error / URL result
    var data = await r.json();
    if(data.success === false){
      resEl.className='result error';
      resEl.innerHTML = '<b>Gagal.</b><br>'+esc((data.error && (data.error.message||data.error)) || data.message || JSON.stringify(data).substring(0,200));
      return;
    }
    var payload = anaExtract(data) || data.data || data;
    var img = '';
    if(typeof payload === 'string' && payload.indexOf('http')===0) img = payload;
    else if(payload) img = payload.url || payload.image || payload.result || payload.link || '';
    if(img){
      resEl.className='result success';
      resEl.innerHTML = '<img src="'+esc(img)+'" style="max-width:100%;border-radius:10px"><br><br>'+
        '<a href="'+esc(img)+'" target="_blank" download class="action" style="display:inline-block;text-decoration:none;padding:10px 18px">Download / Buka</a>';
    } else {
      resEl.className='result error';
      resEl.innerHTML = '<pre style="font-size:0.7rem;white-space:pre-wrap">'+esc(JSON.stringify(data,null,2).substring(0,400))+'</pre>';
    }
  }catch(e){
    resEl.className='result error';
    resEl.textContent = 'Error: '+e.message;
  }
}

function openIDNLive(){

    <button class="action" onclick="doIDNLive()">Cari</button>
    <div class="result" id="idn-result" style="display:none;margin-top:12px"></div>
  `);
}
async function doIDNLive(){
  var res = document.getElementById('idn-result');
  var type = document.getElementById('idn-type').value;
  var page = document.getElementById('idn-page').value || '1';
  res.style.display='block'; res.className='result'; res.textContent='Mencari...';
  try{
    var r = await fetch('https://anabot.my.id/api/search/idn/livestream?type='+encodeURIComponent(type)+'&page='+encodeURIComponent(page)+'&apikey='+encodeURIComponent(ANA_APIKEY));
    var data = await r.json();
    var list = anaExtract(data);
    if(!list || (Array.isArray(list)&&list.length===0)){
      res.className='result error'; res.textContent='Tidak ada hasil.'; return;
    }
    if(!Array.isArray(list)) list = [list];
    var html = '<b>Hasil: '+list.length+'</b><br><br>';
    list.slice(0,20).forEach(function(item){
      var title = item.title || item.name || '-';
      var img = item.image_url || item.image || item.thumbnail || '';
      var views = item.view_count != null ? item.view_count : '';
      var cat = (item.category && item.category.name) || item.category || '';
      var creator = (item.creator && (item.creator.name||item.creator.username)) || '';
      var slug = item.slug || '';
      var link = slug ? 'https://www.idn.app/'+slug : (item.url||'');
      html += '<div style="margin-bottom:12px;padding:10px;background:rgba(0,0,0,0.25);border-radius:10px;border:1px solid rgba(34,197,94,0.2)">';
      if(img) html += '<img src="'+esc(img)+'" style="width:100%;max-height:140px;object-fit:cover;border-radius:8px;margin-bottom:6px" onerror="this.style.display=\'none\'">';
      html += '<b>'+esc(title)+'</b><br>';
      if(creator) html += '<span style="font-size:0.8rem">👤 '+esc(String(creator))+'</span><br>';
      if(cat) html += '<span style="font-size:0.75rem;opacity:0.8">'+esc(String(cat))+'</span> ';
      if(views!=='') html += '<span style="font-size:0.75rem;opacity:0.8">👁 '+esc(String(views))+'</span>';
      if(link) html += '<br><a href="'+esc(link)+'" target="_blank" style="color:#4ade80;font-size:0.8rem">Buka Live</a>';
      html += '</div>';
    });
    res.className='result success';
    res.innerHTML = html;
  }catch(e){
    res.className='result error'; res.textContent='Error: '+e.message;
  }
}

  }

/* ========== ELYSIAN API TOOLS ========== */
function elyExtract(data){
  if(!data) return null;
  if(data.status === false) return null;
  if(data.result !== undefined) return data.result;
  if(data.results !== undefined) return data.results;
  return data;
}

      <input type="file" id="ely-file" style="display:none" onchange="doElyUpload(this.files[0])">
    </div>
    <div class="result" id="ely-result" style="display:none"></div>
  `);
  setupDropZone('ely-zone','ely-file', doElyUpload);
}
async function doElyUpload(file){
  if(!file) return;
  var res = document.getElementById('ely-result');
  res.style.display='block'; res.className='result'; res.textContent='Mengupload...';
  try{
    var form = new FormData();
    form.append('file', file);
    var r = await fetch(ELY_BASE+'/api/uploader/all-in-one.php', { method:'POST', body: form });
    var data = await r.json();
    if(data.status === false){
      res.className='result error';
      res.textContent = data.message || 'Upload gagal';
      return;
    }
    var results = data.results || data.result || {};
    var html = '<b>Berhasil!</b> <span style="opacity:0.8">'+esc(data.input_name||file.name)+'</span><br><br>';
    Object.keys(results).forEach(function(key){
      var item = results[key];
      if(!item) return;
      var url = item.url || (item.raw && item.raw.url) || '';
      var platform = item.platform || key;
      if(url){
        html += '<div style="margin-bottom:8px;padding:8px;background:rgba(0,0,0,0.2);border-radius:8px">';
        html += '<b>'+esc(platform)+'</b><br>';
        html += '<a href="'+esc(url)+'" target="_blank" style="color:#4ade80;word-break:break-all;font-size:0.8rem">'+esc(url)+'</a>';
        html += '</div>';
      }
    });
    res.className='result success';
    res.innerHTML = html;
  }catch(e){
    res.className='result error';
    res.textContent = 'Error: '+e.message;
  }
}

/* TikTok Downloader */
function openTTDL(){
  openModal(`
    <button class="close-btn" onclick="closeModal()">×</button>
    <h2>TikTok Downloader</h2>
    <input type="text" id="ttdl-url" placeholder="https://vt.tiktok.com/... atau link video">
    <button class="action" onclick="doTTDL()">Download</button>
    <div class="result" id="ttdl-result" style="display:none;margin-top:12px"></div>
  `);
}
async function doTTDL(){
  var url = document.getElementById('ttdl-url').value.trim();
  var res = document.getElementById('ttdl-result');
  if(!url){ res.style.display='block'; res.className='result error'; res.textContent='Masukkan URL TikTok'; return; }
  res.style.display='block'; res.className='result'; res.textContent='Memproses...';
  try{
    var r = await fetch(ELY_BASE+'/api/downloader/tiktokv2.php?url='+encodeURIComponent(url));
    var data = await r.json();
    var info = elyExtract(data);
    if(!info){
      res.className='result error';
      res.textContent = (data && data.message) || 'Gagal mengambil video';
      return;
    }
    var video = info.video_tanpa_watermark || info.video || info.no_watermark || '';
    var audio = info.audio_mp3 || info.audio || info.music || '';
    var caption = info.caption || info.title || '';
    var author = info.author || info.username || '';
    var html = '<b>Berhasil!</b><br>';
    if(author) html += '<b>Author:</b> '+esc(String(author))+'<br>';
    if(caption) html += '<b>Caption:</b> '+esc(String(caption).substring(0,180))+'<br>';
    html += '<br>';
    if(video) html += '<a href="'+esc(video)+'" target="_blank" class="action" style="display:inline-block;text-decoration:none;padding:10px 16px;margin:4px">Download Video (No WM)</a><br>';
    if(audio) html += '<a href="'+esc(audio)+'" target="_blank" class="action" style="display:inline-block;text-decoration:none;padding:10px 16px;margin:4px;background:linear-gradient(90deg,#0ea5e9,#0284c7)">Download MP3</a>';
    if(!video && !audio) html += '<pre style="font-size:0.7rem">'+esc(JSON.stringify(info,null,2).substring(0,400))+'</pre>';
    res.className='result success';
    res.innerHTML = html;

/* ========== NEW ELYSIAN API TOOLS ========== */
function elyFetch(url){
  return fetch(url, {headers:{'Accept':'*/*'}}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r;
  });
}


function elyPrettyValue(value){
  if(value === null || value === undefined) return '';
  if(typeof value === 'string') return value;
  if(Array.isArray(value)) return value.map(elyPrettyValue).filter(Boolean).join('\n');
  if(typeof value === 'object'){
    var preferred = ['answer','response','message','text','content','result','caption','description','title','transcript','transcription','url','image','imageUrl','audio','audioUrl','data'];
    for(var i=0;i<preferred.length;i++){
      if(value[preferred[i]] !== undefined){
        var v=elyPrettyValue(value[preferred[i]]);
        if(v) return v;
      }
    }
    var parts=[];
    Object.keys(value).forEach(function(k){
      var v=value[k];
      if(v === null || v === undefined || typeof v === 'object') return;
      parts.push(k.replace(/[_-]/g,' ')+': '+String(v));
    });
    return parts.join('\n');
  }
  return String(value);
}

function elyRenderNormal(res, value){
  var out=elyPrettyValue(value);
  res.className='result success';
  res.textContent=out || 'Tidak ada hasil.';
}

function elyShowError(id, err){
  var res=document.getElementById(id);
  if(!res)return;
  res.style.display='block';
  res.className='result error';
  res.textContent='API error: '+(err && err.message ? err.message : String(err));
}

async function doTranslate(){
  var text = document.getElementById('tr-text').value.trim();
  var source = document.getElementById('tr-source').value;
  var target = document.getElementById('tr-target').value;
  var res = document.getElementById('tr-result');
  res.style.display = 'block';
  res.className = 'result';
  res.textContent = 'Menerjemahkan...';
  if(!text){ res.className='result error'; res.textContent='Isi teks dulu'; return; }
  try{
    var url = SIPUTZX+'/api/tools/translate?text='+encodeURIComponent(text)+'&source='+encodeURIComponent(source)+'&target='+encodeURIComponent(target);
    var r = await fetch(url);
    var data = await r.json();
    // Rapikan hasil - jangan tampilkan JSON mentah
    var translated = '';
    if(typeof data === 'string') translated = data;
    else if(data.result) translated = (typeof data.result === 'string') ? data.result : (data.result.translated || data.result.text || data.result.translation || JSON.stringify(data.result));
    else if(data.translated) translated = data.translated;
    else if(data.translation) translated = data.translation;
    else if(data.data) translated = (typeof data.data === 'string') ? data.data : (data.data.translated || data.data.text || data.data.result || '');
    else if(data.text) translated = data.text;
    else translated = data.message || data.output || '';

    if(!translated) translated = 'Tidak ada hasil terjemahan.';

    res.className = 'result success';
    res.innerHTML = '<b>Asli:</b><br>'+esc(text)+'<br><br><b>Hasil ('+esc(source)+' → '+esc(target)+'):</b><br>'+esc(String(translated));

  }
}

function openBypass(){
  openModal(`
    <button class="close-btn" onclick="closeModal()">×</button>

    <input type="url" id="bp-url" placeholder="URL shortlink / locked">
    <button class="action" onclick="doBypass()">Bypass</button>
    <div class="result" id="bp-result" style="display:none"></div>
  `);
}
async function doBypass(){
  var url = document.getElementById('bp-url').value.trim();
  var res = document.getElementById('bp-result');
  res.style.display = 'block';
  res.className = 'result';
  res.textContent = 'Memproses...';
  if(!url){ res.className='result error'; res.textContent='Masukkan URL'; return; }
  try{
    var r = await fetch(FCS_BASE+'/bypass?url='+encodeURIComponent(url)+'&api_key='+encodeURIComponent(FCS_KEY));
    var data = await r.json();
    var out = data.result || data.data || data.url || data.link || data;
    var link = '';
    var text = '';
    if(typeof out === 'string'){
      if(out.indexOf('http')===0) link = out;
      else text = out;
    } else if(out && typeof out === 'object'){
      link = out.url || out.link || out.result || out.destination || '';
      text = out.message || out.msg || '';
      if(!link && !text){
        Object.keys(out).forEach(function(k){
          var v = out[k];
          if(typeof v === 'string') text += k+': '+v+'\n';
        });
      }
    }
    res.className = 'result success';
    res.innerHTML = (link ? '<b>Hasil:</b><br><a href="'+esc(link)+'" target="_blank">'+esc(link)+'</a><br><br>' : '') +
      (text ? esc(String(text)) : (!link ? 'Tidak ada hasil.' : ''));
  }catch(e){
    res.className = 'result error';
    res.textContent = 'Gagal: '+(e.message||e);
  }
}

/* ========== ANABOT BRAT + IQC V2 ========== */
async function anaFetchImage(url, resEl, filename){
  resEl.style.display = 'block';
  resEl.className = 'result';
  resEl.textContent = 'Memproses...';
  try{
    var r = await fetch(url);
    var ct = (r.headers.get('content-type')||'');
    if(ct.indexOf('image/')===0){
      var blob = await r.blob();
      var u = URL.createObjectURL(blob);
      resEl.className = 'result success';
      resEl.innerHTML = '<img src="'+u+'" style="max-width:100%;border-radius:10px;border:1px solid rgba(34,197,94,0.3)"><br><br><a href="'+u+'" download="'+(filename||'result.png')+'" class="action" style="display:inline-block;text-decoration:none;text-align:center">Download</a>';
      return;
    }
    var data = await r.json();
    var img = '';
    if(typeof data === 'string' && data.indexOf('http')===0) img = data;
    else if(data.result && typeof data.result === 'string' && data.result.indexOf('http')===0) img = data.result;
    else if(data.url) img = data.url;
    else if(data.image) img = data.image;
    else if(data.data && typeof data.data === 'string') img = data.data;
    else if(data.result && data.result.url) img = data.result.url;
    else if(data.result && data.result.image) img = data.result.image;
    if(img){
      resEl.className = 'result success';
      resEl.innerHTML = '<img src="'+esc(img)+'" style="max-width:100%;border-radius:10px"><br><br><a href="'+esc(img)+'" target="_blank" class="action" style="display:inline-block;text-decoration:none;text-align:center">Buka Gambar</a>';
    } else {
      resEl.className = 'result error';
      resEl.textContent = 'Gagal mendapatkan gambar.';
    }
  }catch(e){
    resEl.className = 'result error';
    resEl.textContent = 'Gagal: '+(e.message||e);
  }
}
